# =============================================================================
# Variable Caps & Constraints — Urban Heat Island Domain
# =============================================================================
# Hard physical bounds, intervention delta limits, and monotonicity rules.
# These prevent physically impossible scenarios during simulation.
#
# Referenced by: project.yml → physics.caps_file
# =============================================================================

# Variable Constraints — absolute physical bounds
variable_bounds:
  Pct_Canopy:
    min: 0.0
    max: 100.0
    units: "percentage points"
    description: "Tree canopy coverage percentage"
    physical_justification: "Cannot have negative canopy or exceed 100%"

  Pct_Impervious:
    min: 0.0
    max: 100.0
    units: "percentage points"
    description: "Impervious surface coverage percentage"
    physical_justification: "Cannot have negative impervious or exceed 100%"

  NDVI:
    min: -0.1
    max: 0.9
    units: "index value"
    description: "Normalized Difference Vegetation Index"
    physical_justification: "Water/bare soil can be slightly negative; dense vegetation ~0.8-0.9"

  Albedo:
    min: 0.05
    max: 0.70
    units: "reflectance fraction"
    description: "Surface albedo (reflectance)"
    physical_justification: "Dark asphalt ~0.05; white cool coating ~0.70"

# Intervention Delta Constraints — maximum single-step changes
delta_constraints:
  Pct_Canopy:
    max_increase: 50.0
    max_decrease: 0.0
    typical_increase: 20.0

  Pct_Impervious:
    max_increase: 0.0
    max_decrease: 50.0
    typical_decrease: 15.0

  NDVI:
    max_increase: 0.4
    max_decrease: 0.0
    typical_increase: 0.15

  Albedo:
    max_increase: 0.40
    max_decrease: 0.0
    typical_increase: 0.15

# Monotonicity Rules
monotonicity:
  Pct_Canopy:
    expected_sign: "negative"
    description: "Increasing canopy coverage must cool"

  Pct_Impervious:
    expected_sign: "positive"
    intervention_sign: "negative"
    description: "Decreasing impervious surfaces must cool"

  NDVI:
    expected_sign: "negative"
    description: "Increasing vegetation must cool"

  Albedo:
    expected_sign: "negative"
    description: "Increasing reflectance must cool"

# Capacity Headroom Calculations
capacity_rules:
  Pct_Canopy:
    formula: "min(100 - current_value, max_increase)"
    description: "Cannot exceed 100% total coverage"

  Pct_Impervious:
    formula: "min(current_value, max_decrease)"
    description: "Cannot reduce below 0%"

  NDVI:
    formula: "min(0.9 - current_value, max_increase)"
    description: "Limited by dense vegetation maximum"

  Albedo:
    formula: "min(0.70 - current_value, max_increase)"
    description: "Limited by white coating maximum"

# Combined Intervention Constraints
combined_constraints:
  canopy_impervious_sum:
    rule: "delta_canopy + current_canopy + delta_impervious + current_impervious <= 100"
    description: "Total coverage cannot exceed 100%"
    enforcement: "warning"

  ndvi_canopy_consistency:
    rule: "If delta_canopy > 20, expect delta_ndvi > 0.05"
    description: "Large canopy increases should increase NDVI"
    enforcement: "soft"

  albedo_impervious_dependency:
    rule: "Albedo interventions only apply to impervious surfaces"
    description: "Cool pavement requires impervious surface area"
    enforcement: "informational"

# Validation Thresholds
validation:
  max_single_cell_delta: 10.0     # response units — unrealistic if exceeded
  typical_max_delta: 5.0          # response units — flag for review
  max_zone_avg_delta: 4.0         # response units — zone average cap
  sign_violation_action: "error"
  magnitude_violation_action: "warning"

# ---------------------------------------------------------------------------
# Diminishing-Return Thresholds
# ---------------------------------------------------------------------------
# Beyond this absolute-change threshold, the marginal response tapers via a
# sqrt function.  Setting a small value = aggressive tapering; setting a
# large value = nearly linear response across the full range.
diminishing_return_thresholds:
  Pct_Canopy: 10.0          # 10 percentage-points
  Pct_Impervious: 10.0
  NDVI: 0.10                # 0.10 NDVI units
  Albedo: 0.10
  Elevation_m: 5.0          # 5 metres
  Distance_from_water_m: 100.0
  default: 10.0             # fallback for unlisted variables

# ---------------------------------------------------------------------------
# Sign-Violation Guardrail Strategy
# ---------------------------------------------------------------------------
# Controls what happens when the model-predicted Δ has the *wrong* sign
# relative to the physics prior (e.g. increasing canopy leads to warming).
#
# Strategies:
#   "dampen"  — reduce violation magnitude by ``dampen_factor`` (default)
#   "zero"    — zero-out the offending cells entirely
#   "keep"    — do nothing; trust the model
sign_violation_strategy: "dampen"
sign_violation_dampen_factor: 0.50

# ---------------------------------------------------------------------------
# MGWR Reliability Threshold
# ---------------------------------------------------------------------------
# Minimum mean |local coefficient| (z-score per raw unit) for which MGWR
# spatial heterogeneity is considered reliable.  Below this, the engine
# blends toward the physics literature coefficient.
mgwr_reliability_threshold: 0.01
