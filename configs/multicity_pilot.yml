# SPARC Multi-City Pilot — Zero-Shot UHI Transfer
# ================================================
# Edit feature_columns / label_columns to add/drop variables without code changes.
# Bboxes are WGS-84 (minx, miny, maxx, maxy).

multicity:
  output_dir: "output/cities"
  fishnet_resolution_m: 30

  pilot_cities:
    - city: "Philadelphia, PA"
      city_slug: "philadelphia_pa"
      holdout: true
      bbox: [-75.28, 39.86, -74.96, 40.14]
      utm_epsg: "EPSG:32618"

    - city: "Providence, RI"
      city_slug: "providence_ri"
      holdout: false
      bbox: [-71.50, 41.75, -71.35, 41.90]
      utm_epsg: "EPSG:32619"

    - city: "Raleigh, NC"
      city_slug: "raleigh_nc"
      holdout: false
      bbox: [-78.78, 35.70, -78.54, 35.90]
      utm_epsg: "EPSG:32617"
      campaign_date_override: "2021-06-17"   # ERA5-matched; OSF filename date was upload date

    - city: "Chicago, IL"
      city_slug: "chicago_il"
      holdout: false
      bbox: [-87.94, 41.64, -87.52, 42.02]
      utm_epsg: "EPSG:32616"
      campaign_date_override: "2023-07-28"   # ERA5-matched; OSF filename date was upload date

    - city: "Atlanta, GA"
      city_slug: "atlanta_ga"
      holdout: false
      bbox: [-84.55, 33.65, -84.29, 33.89]
      utm_epsg: "EPSG:32616"
      campaign_date_override: "2021-09-26"   # ERA5-matched; OSF filename date was upload date

    - city: "Seattle, WA"
      city_slug: "seattle_wa"
      holdout: false
      bbox: [-122.46, 47.49, -122.24, 47.73]
      utm_epsg: "EPSG:32610"
      campaign_date_override: "2020-09-09"   # ERA5-matched; OSF filename date was upload date

    - city: "Albuquerque, NM"
      city_slug: "albuquerque_nm"
      holdout: false
      bbox: [-106.78, 35.04, -106.52, 35.22]
      utm_epsg: "EPSG:32613"
      campaign_date_override: "2021-06-06"   # ERA5-matched; OSF filename date was upload date

    - city: "Burlington, VT"
      city_slug: "burlington_vt"
      holdout: false
      bbox: [-73.27, 44.43, -73.15, 44.55]
      utm_epsg: "EPSG:32618"

    - city: "Wilmington, DE"
      city_slug: "wilmington_de"
      holdout: false
      bbox: [-75.61, 39.69, -75.51, 39.78]
      utm_epsg: "EPSG:32618"   # Cfa, dedicated OSF node yef5w; 30mi from Philadelphia

    - city: "Baltimore, MD"
      city_slug: "baltimore_md"
      holdout: false
      bbox: [-76.72, 39.20, -76.53, 39.37]
      utm_epsg: "EPSG:32618"
      campaign_date_override: "2019-07-20"   # 2019 NIHHIS campaign; ERA5-matched

    - city: "Charlotte, NC"
      city_slug: "charlotte_nc"
      holdout: false
      bbox: [-80.99, 35.10, -80.72, 35.35]
      utm_epsg: "EPSG:32617"

    - city: "New Orleans, LA"
      city_slug: "new_orleans_la"
      holdout: false
      bbox: [-90.14, 29.89, -89.90, 30.08]
      utm_epsg: "EPSG:32615"

  # ── Feature / label columns ─────────────────────────────────────────────
  # Edit here to add/drop variables. No code changes needed.
  feature_columns:
    land_surface:
      - pct_impervious
      - pct_canopy
      - land_cover
      - ndvi
      - ndbi
      - lst
      - ndvi_s2
      - ndbi_s2
      - mndwi_s2
      - albedo
      - bldg_height_mean
      - bldg_coverage
      - svf
      - cdc_svi
      - elevation_m
      - slope_deg
      - aspect_deg
      - distance_water_m

    era5_morning:
      - era5_morning_t2m
      - era5_morning_windspeed
      - era5_morning_winddir
      - era5_morning_rh

    era5_midday:
      - era5_midday_t2m
      - era5_midday_windspeed
      - era5_midday_winddir
      - era5_midday_rh

    era5_evening:
      - era5_evening_t2m
      - era5_evening_windspeed
      - era5_evening_winddir
      - era5_evening_rh

  label_columns:
    - aat_morning
    - aat_midday
    - aat_night
    - diurnal_aat

  metadata_columns:
    - city_slug
    - utm_epsg
    - campaign_date

  # ── Pipeline stages to run per city ────────────────────────────────────
  pipeline:
    stages: ["0", "2", "3"]   # skip stage 1 (GWEN) for speed on first pass
    primary_target: "aat_midday"
    coordinate_columns: ["centroid_x", "centroid_y"]

  # ── JEPA pretraining ────────────────────────────────────────────────────
  jepa:
    hidden_dim: 256
    n_epochs: 150
    batch_size: 4096   # GPU: ~20k gradient steps/city — empirical sweet spot
    mask_ratio: 0.40
    n_patches: 4
    ema_tau: 0.99
    lr: 1e-3
    head_weight_decay: 0.1   # L2 on heads — prevents OOD extrapolation (train23)
    seed: 43                 # deterministic head init — reproducible convergence

    # ── PI-JEPA physics-informed masking (I2 / I1) ───────────────────────
    # Enable ONE at a time; revert if sum_corr does not beat baseline + 2*sigma.
    # Baseline: sum_corr = 1.397 +/- 0.024 (3-seed mean, t66 trunk, seed 42/43/44).
    # I2: set patch radius from Stage 0 effective correlation range (~5-7 km)
    #     instead of the default bbox-derived value (~164 km, effectively random).
    range_scaled_radius: false   # I2v3 REVERTED: 6km radius too large per-city (bbox-derived radius is better)
    # I1: use elliptical patches shaped by eccentricity (B2 verdict: V-DIR-UNRELIABLE
    #     so theta=0, no rotation -- uses axis-ratio magnitude only).
    anisotropic_mask: false      # I1 REVERTED: ecc=1.358 destabilizes midday (corr=-0.041)
    # B6: sample each batch from a single city only (instead of shuffled multi-city).
    #     Makes spatial masking physically meaningful (no cross-city coord overlap).
    #     KEEP -- sum_corr=1.490, +3.9σ above baseline. Unblocked I2v3.
    per_city_batching: false     # B6 REVERTED — 3-seed mean=1.110 σ=0.341 (seed43 midday=-0.270)

    # ── A2: Energy-balance pretext head ──────────────────────────────────
    # Auxiliary head predicts (1 - albedo) = shortwave absorption proxy.
    # Forces trunk to encode surface energy uptake, grounding UHI representation.
    # albedo is land_surface feature index 9 (confirmed against live feature order).
    # LOCKED w=0.05 (2026-06-10): 3-seed mean=1.492 (+6.8σ above baseline), midday +0.075 vs w=0.1
    energy_balance_weight: 0.05
    energy_balance_albedo_idx: 9

    # ── E5: Eigenmap-FCM auxiliary head ──────────────────────────────────
    # Auxiliary head predicts fuzzy cluster memberships in Laplacian eigenspace.
    # REVERTED seed=42: sum=1.244 (morning=0.527, midday=0.313, evening=0.404)
    # FCM cluster targets at 15K subsample too coarse — trunk wastes capacity on
    # spatial zone labels instead of fine-grained thermal structure.
    eigen_target_weight: 0.0   # E5 REVERTED — seed42 sum=1.244 << baseline 1.397
    eigen_k_clusters: 4
    eigen_n_components: 2
    eigen_max_subsample: 15000

    # ── LOO ensemble per-window exclusions ───────────────────────────────
    # Explicitly exclude specific city heads from LOO ensemble windows.
    # Charlotte's evening head (69.84°F mean) drags ~9°F below the cluster
    # (Raleigh 78.5, Atlanta 83.0, Seattle 87.6) hurting spatial correlation.
    # Charlotte still participates in morning (all-time best +0.493) and midday.
    loo_exclude_per_window:
      evening: [charlotte_nc]

  # ── Continual learning (EWC) ─────────────────────────────────────────
  continual_learning:
    ewc_lambda: 400.0
    replay_fraction: 0.05
