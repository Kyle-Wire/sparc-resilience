  # ── Feature / label columns ─────────────────────────────────────────────
  # Edit here to add/drop variables. No code changes needed.
  feature_columns:
    land_surface:
      - pct_impervious
      - pct_canopy
      - land_cover
      - ndvi
      - ndbi
      - lst
      - ndvi_s2
      - ndbi_s2
      - mndwi_s2
      - albedo
      - bldg_height_mean
      - bldg_coverage
      - svf
      - cdc_svi
      - elevation_m
      - slope_deg
      - aspect_deg
      - distance_water_m

    era5_morning:
      - era5_morning_t2m
      - era5_morning_windspeed
      - era5_morning_winddir
      - era5_morning_rh

    era5_midday:
      - era5_midday_t2m
      - era5_midday_windspeed
      - era5_midday_winddir
      - era5_midday_rh

    era5_evening:
      - era5_evening_t2m
      - era5_evening_windspeed
      - era5_evening_winddir
      - era5_evening_rh

  label_columns:
    - aat_morning
    - aat_midday
    - aat_night
    - diurnal_aat

  metadata_columns:
    - city_slug
    - utm_epsg
    - campaign_date

  # ── Pipeline stages to run per city ────────────────────────────────────
  pipeline:
    stages: ["0", "2", "3"]   # skip stage 1 (GWEN) for speed on first pass
    primary_target: "aat_midday"
    coordinate_columns: ["centroid_x", "centroid_y"]

  # ── JEPA pretraining ────────────────────────────────────────────────────
  jepa:
    hidden_dim: 256
    n_epochs: 150
    batch_size: 4096   # GPU: ~20k gradient steps/city — empirical sweet spot
    mask_ratio: 0.40
    n_patches: 4
    ema_tau: 0.99
    lr: 1e-3
    head_weight_decay: 0.1   # L2 on heads — prevents OOD extrapolation (train23)
    seed: 43                 # deterministic head init — reproducible convergence

    # ── PI-JEPA physics-informed masking (I2 / I1) ───────────────────────
    # Enable ONE at a time; revert if sum_corr does not beat baseline + 2*sigma.
    # Baseline (A2-locked): sum_corr = 1.492 +/- sigma_new (to be established).
    # I2: set patch radius from Stage 0 effective correlation range (~5-7 km)
    #     instead of the default bbox-derived value (~164 km, effectively random).
    range_scaled_radius: false   # I2v3 REVERTED: 6km radius too large per-city (bbox-derived radius is better)
    # I1: use elliptical patches shaped by eccentricity (B2 verdict: V-DIR-UNRELIABLE
    #     so theta=0, no rotation -- uses axis-ratio magnitude only).
    anisotropic_mask: false      # I1 EXHAUSTED: full sweep 1.05-1.20 shows proxy improves but
                                 # LOO midday regresses at every eccentricity (s42: 1.05->1.470,
                                 # vs A2-locked baseline 1.513). A3 proxy != LOO correlation.
    # I1-sweep: override eccentricity directly (bypasses Stage 0 median=1.358).
    # SWEEP COMPLETE -- winner was ecc=1.15 by proxy (0.4112) but LOO sum=1.470 < baseline 1.492.
    # Set to null to use Stage 0 median (not recommended -- ecc=1.358 is catastrophic).
    eccentricity_override: null
    # B6: sample each batch from a single city only (instead of shuffled multi-city).
    #     Makes spatial masking physically meaningful (no cross-city coord overlap).
    #     KEEP -- sum_corr=1.490, +3.9σ above baseline. Unblocked I2v3.
    per_city_batching: false     # B6 REVERTED — 3-seed mean=1.110 σ=0.341 (seed43 midday=-0.270)

    # ── A2: Energy-balance pretext head ──────────────────────────────────
    # Auxiliary head predicts (1 - albedo) = shortwave absorption proxy.
    # Forces trunk to encode surface energy uptake, grounding UHI representation.
    # albedo is land_surface feature index 9 (confirmed against live feature order).
    # LOCKED w=0.05 (2026-06-10): 3-seed mean=1.492 (+6.8σ above baseline), midday +0.075 vs w=0.1
    energy_balance_weight: 0.05
    energy_balance_albedo_idx: 9

    # ── E5: Eigenmap-FCM auxiliary head ──────────────────────────────────
    # Auxiliary head predicts fuzzy cluster memberships in Laplacian eigenspace.
    # REVERTED seed=42: sum=1.244 (morning=0.527, midday=0.313, evening=0.404)
    # FCM cluster targets at 15K subsample too coarse — trunk wastes capacity on
    # spatial zone labels instead of fine-grained thermal structure.
    eigen_target_weight: 0.0   # E5 REVERTED — seed42 sum=1.244 << baseline 1.397
    eigen_k_clusters: 4
    eigen_n_components: 2
    eigen_max_subsample: 15000

    # ── LOO ensemble per-window exclusions ───────────────────────────────
    # Explicitly exclude specific city heads from LOO ensemble windows.
    # NOTE: Charlotte exclusion was needed when charlotte_nc used wrong campaign date
    # (2024-08-06 upload vs 2024-07-09 actual). After date fix + re-collection, its
    # evening head calibration should normalize. Clear this after re-collecting.
    loo_exclude_per_window:
      evening: []

  # ── Continual learning (EWC) ─────────────────────────────────────────
  continual_learning:
    ewc_lambda: 400.0
    replay_fraction: 0.05
