# SPARC core pipeline — Providence from OPEN DATA only (any-city builder check)
# Same target (brown4 AAT_z), but every predictor comes from `sparc core features`:
# WorldCover canopy/built-up/water, Sentinel-2 NDVI and broadband albedo, Copernicus DEM.
# Compare held-out skill and effects with configs/core_providence.yml at the same resolution:
#   sparc core run -p configs/core_providence_open.yml --coarse 60 --stages S0,S1,S2,S3,S4,S5
# =============================================================================
# Run:   sparc core run --project configs/core_providence.yml
# Fast:  sparc core run --project configs/core_providence.yml --fast   (8k-point window)
#
# Data notes (see docs/results/providence_core.md):
#   * AAT_z is ambient air temperature in °F (81–93.5), NOT a z-score.
#   * Points sit on an exact 30 m lattice in EPSG:3438 (US survey feet); we keep
#     that frame (scaled to metres) instead of reprojecting to UTM, which would
#     rotate the lattice by ~1.6° and create binning holes.
#   * 72% of target values are whole °F — the product looks like a rounded,
#     interpolated raster, so physical parameters partly describe that
#     interpolator.  RMSE below ~0.29 °F (rounding noise) is not meaningful.
#   * Canopy + impervious > 100% on ~35% of cells (canopy overhangs pavement),
#     so no canopy/impervious sum coupling is imposed.
core:
  name: providence_uhi_open

  data:
    path: ../brown4.csv
    target: AAT_z
    target_units: degF
    id: OBJECTID
    x: POINT_X
    y: POINT_Y
    crs: "EPSG:3438"
    coord_unit: us_survey_foot
    background: median          # ΔT reference = field median (ERA5 forcing is used by the physics only)
    zone: Location              # neighbourhood / zone codes (0 = unassigned) — reporting only
    join:
      - {path: layers/providence_open_features.parquet, on: OBJECTID, right_on: id}

  predictors:
    - open_canopy
    - open_impervious
    - open_ndvi
    - open_albedo
    - open_elevation
    - open_water_distance

  qa:
    clip:
      open_albedo: [0.02, 0.9]
      open_canopy: [0, 100]
      open_impervious: [0, 100]

  actionable:
    open_canopy:
      min: 0
      max: 100
      unit: "pp"
      doses: [0, 5, 10, 15, 20, 30, 40, 50]
      cost_per_unit: 1.0
    open_impervious:
      min: 0
      max: 100
      unit: "pp"
      direction: decrease
      doses: [0, 5, 10, 15, 20, 30, 40, 50]
      cost_per_unit: 1.0
    open_albedo:
      min: 0.02
      max: 0.9
      unit: "reflectance"
      doses: [0, 0.02, 0.05, 0.10, 0.15]
      cost_per_unit: 100.0

  coupling: []                   # see note above

  mediators:
    open_ndvi:
      parents: [open_canopy, open_impervious]
      context: [open_elevation, open_water_distance]
      monotone: {open_canopy: 1, open_impervious: -1}

  physics:
    enabled: true
    # Campaign forcing: the Rhode Island Heat Watch traverses ran on 2020-07-29
    # (6–7, 15–16, 19–20 EDT and 0–1 on 07-30; RIDOH/RIDEM/American Forests with
    # CAPA).  The target (median 88 °F, 81–93.5 °F) matches the afternoon
    # traverse (KPVD 86–89 °F at 15–16 EDT; 80–84 °F at 19–20).  ERA5: SW↓
    # 636 W/m² (clear-sky index 0.87), net LW −71 W/m², 2 m T 87.8 °F (KPVD
    # 87.5 °F); KPVD wind 7.7 m/s from S (ERA5 4.5 m/s from SW).  Regenerate:
    #   sparc core forcing -p configs/core_providence.yml --date 2020-07-29 --hours 15-16 \
    #       --station 72507014765 --out configs/forcing/providence_2020-07-29.json
    forcing: forcing/providence_2020-07-29.json
    roles:
      albedo: open_albedo
      canopy: open_canopy
      impervious: open_impervious
      ndvi: open_ndvi
      elevation: open_elevation
      water_distance: open_water_distance
    # wind comes from the forcing file; S3 keeps advection only if it beats v = 0 out of fold

  influence:
    max_lag_m: 2000
    n_rings: 10
    n_perm: 19

  cv:
    n_folds: 5
    block_m: auto
    buffer_m: auto
    seed: 42

  models: {ols: true, mgwr: true, gwrf: true, gam: true, physics: true}

  stacker:
    epochs: 400
    tune_lambda: [0.0, 0.1, 1.0]

  scenarios:
    - name: "Canopy Increase"
      variable: open_canopy
      direction: increase
      increments: [5, 10, 20, 30]
    - name: "Impervious Decrease"
      variable: open_impervious
      direction: decrease
      increments: [5, 10, 20, 30]
    - name: "Albedo Increase"
      variable: open_albedo
      direction: increase
      increments: [0.02, 0.05, 0.10]

  joint_scenarios:
    - name: "Green Infrastructure Package"
      interventions:
        - {variable: open_canopy, direction: increase, increment: 15}
        - {variable: open_impervious, direction: decrease, increment: 15}
        - {variable: open_albedo, direction: increase, increment: 0.05}

  causal:
    enabled: true
    treatments: [open_canopy, open_impervious, open_albedo]
    confounders:
      open_canopy: [open_impervious, open_albedo, open_elevation, open_water_distance]
      open_impervious: [open_canopy, open_albedo, open_elevation, open_water_distance]
      open_albedo: [open_canopy, open_impervious, open_elevation, open_water_distance]
    exclude_controls:            # descendants (mediators) are never adjusted for
      open_canopy: [open_ndvi]
      open_impervious: [open_ndvi]
    contrast: {open_canopy: 10, open_impervious: -10, open_albedo: 0.05}
    dag_audit: false

  climate:                       # CMIP6 projections × adaptation (delta method)
    enabled: false
    source: table                # regenerate: sparc core climate --lat 41.826 --lon -71.403 --out configs/climate/providence_cmip6_tasmax_jja.csv
    table: climate/providence_cmip6_tasmax_jja.csv
    site: [41.826, -71.403]      # Providence (Brown University)
    thresholds: [90, 95]         # °F

  optimize:
    enabled: false
    variable: open_canopy
    budget: 20000                # dose-units (pp × cells) — e.g. +10 pp on 2,000 cells
    cost_per_unit: 1.0
    equity_column: null

  planner:                       # sparc core layers / sparc core planner
    layers: layers/providence_layers.parquet   # HRSL residents (all, 60+, under 5) + WorldCover fractions
    paved_plantable_share: 0.2   # share of paved/built area counted as plantable (street trees, lots)
    ghcn_station: USW00014765    # Providence T.F. Green airport, daily Tmax for hot-day counts

  output:
    dir: ../output/core/providence

  report:                        # text for scripts/results_page/build_page.py
    title: Providence Heat Model
    place: Providence, RI
    area: the Brown University / Providence study area
    limitations:                 # model card (in addition to the data findings)
      - "The target is CAPA's area-wide temperature surface: traverse measurements from the 2020-07-29 afternoon run extended to every cell by a model on land-cover predictors. Fitted land-cover effects partly describe that model, not only the atmosphere; refit on the raw traverse points when they are available."
    caveats:
      - "For tree canopy the causal check agrees with the model on the neighbourhood effect, but finds a small warming association for a cell's own canopy once its neighbours are accounted for, where the model sees almost none. Both agree that canopy's cooling comes from the surrounding area rather than the cell itself."
      - "Numbers from the earlier pipeline (R² 0.944, 'z-units') came from a leaky evaluation and a neural stacker that never trained. AAT_z is air temperature in °F. Use this page instead."
