# SPARC core config for Charleston, SC: written by scripts/setup_core_city.py charleston_sc
# Campaign 2021-07-31, afternoon run 15-16 h local (from the traverse timestamps); grid: 30 m UTM over [-80.05, 32.72, -79.85, 32.92].
# Data and predictors are regenerated by the script into output/ (not committed).
core:
  name: charleston_sc_uhi
  data:
    path: ../output/core/charleston_sc/charleston_sc_grid.csv
    target: aat_midday
    target_units: degF
    id: id
    x: x
    y: y
    crs: EPSG:32617
    coord_unit: m
    background: median
    join:
    - path: ../output/core/charleston_sc/charleston_sc_open_features.parquet
      key: id
      right_key: id
  predictors:
  - open_canopy
  - open_impervious
  - open_ndvi
  - open_albedo
  - open_elevation
  - open_water_distance
  qa:
    clip:
      open_albedo:
      - 0.02
      - 0.9
      open_canopy:
      - 0
      - 100
      open_impervious:
      - 0
      - 100
  actionable:
    open_canopy:
      min: 0
      max: 100
      unit: pp
      doses: &id001
      - 0
      - 5
      - 10
      - 15
      - 20
      - 30
      - 40
      - 50
      cost_per_unit: 1.0
    open_impervious:
      min: 0
      max: 100
      unit: pp
      doses: *id001
      cost_per_unit: 1.0
      direction: decrease
    open_albedo:
      min: 0.02
      max: 0.9
      unit: reflectance
      doses:
      - 0
      - 0.02
      - 0.05
      - 0.1
      - 0.15
      cost_per_unit: 100.0
  coupling: []
  mediators:
    open_ndvi:
      parents:
      - open_canopy
      - open_impervious
      context:
      - open_elevation
      - open_water_distance
      monotone:
        open_canopy: 1
        open_impervious: -1
  physics:
    enabled: true
    forcing: forcing/charleston_sc_2021-07-31.json
    roles:
      albedo: open_albedo
      canopy: open_canopy
      impervious: open_impervious
      ndvi: open_ndvi
      elevation: open_elevation
      water_distance: open_water_distance
  influence:
    max_lag_m: 2000
    n_rings: 10
    n_perm: 19
  cv:
    n_folds: 5
    block_m: auto
    buffer_m: auto
    seed: 42
  models:
    ols: true
    mgwr: true
    gwrf: true
    gam: true
    physics: true
  stacker:
    epochs: 400
    tune_lambda:
    - 0.0
    - 0.1
    - 1.0
  scenarios:
  - name: Canopy Increase
    variable: open_canopy
    direction: increase
    increments:
    - 5
    - 10
    - 20
    - 30
  - name: Impervious Decrease
    variable: open_impervious
    direction: decrease
    increments:
    - 5
    - 10
    - 20
    - 30
  - name: Albedo Increase
    variable: open_albedo
    direction: increase
    increments:
    - 0.02
    - 0.05
    - 0.1
  causal:
    enabled: true
    treatments:
    - open_canopy
    - open_impervious
    - open_albedo
    confounders:
      open_canopy:
      - open_impervious
      - open_albedo
      - open_elevation
      - open_water_distance
      open_impervious:
      - open_canopy
      - open_albedo
      - open_elevation
      - open_water_distance
      open_albedo:
      - open_canopy
      - open_impervious
      - open_elevation
      - open_water_distance
    exclude_controls:
      open_canopy:
      - open_ndvi
      open_impervious:
      - open_ndvi
    contrast:
      open_canopy: 10
      open_impervious: -10
      open_albedo: 0.05
    dag_audit: false
  climate:
    enabled: false
    site:
    - 32.7983
    - -79.9894
    thresholds:
    - 90
    - 95
  optimize:
    enabled: false
    variable: open_canopy
    budget: 20000
    cost_per_unit: 1.0
    equity_column: null
  planner:
    layers: ../output/core/charleston_sc/charleston_sc_layers.parquet
    paved_plantable_share: 0.2
    ghcn_station: USW00000198
  output:
    dir: ../output/core/charleston_sc
  report:
    title: Charleston, SC Heat Model
    place: Charleston, SC
    area: the Charleston, SC Heat Watch area
    limitations:
    - The target is CAPA's area-wide afternoon temperature surface from the 2021-07-31 campaign, extended to every cell by
      a model on land-cover predictors; canopy effects come from the raw traverses (python -m sparc.core.identify), not this
      map.
