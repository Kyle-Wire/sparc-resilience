[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc"
version = "2.1.0"
description = "SPARC – Spatial Analysis and Research Core pipeline for geographically weighted modeling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary – SPARC Labs LLC"}
authors = [
    {name = "SPARC Labs LLC"}
]

dependencies = [
    # Core scientific stack
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",

    # Spatial analysis
    "geopandas>=0.14",
    "libpysal>=4.7",
    "esda>=2.5",
    "mgwr>=2.2",
    "pyproj>=3.6",

    # Modeling
    "optuna>=3.3",
    "pygam>=0.9",

    # Deep learning
    "torch>=2.0",

    # CMA-ES hyperparameter optimization (V2)
    "cma>=3.0",

    # Causal inference
    "dowhy>=0.11",
    "networkx>=3.1",
    "econml>=0.15",
    "causal-learn>=0.1.3.8",
    "tigramite>=5.2",

    # Visualization & reporting
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",

    # Utilities
    "joblib>=1.3",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "jsonschema>=4.19",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
dask = [
    "dask[dataframe]>=2024.1",
    "dask-geopandas>=0.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
sparc = "sparc.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparc*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.csv"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
