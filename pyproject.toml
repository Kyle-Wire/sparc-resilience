[build-system]
requires = ["setuptools>=68.0", "wheel", "build>=1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sparc"
version = "1.0.10"
description = "SPARC – Spatial Analysis and Research Core pipeline for geographically weighted modeling"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Proprietary"
authors = [
    {name = "SPARC Labs LLC"}
]

dependencies = [
    # Core scientific stack
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    # >=1.5 fixes PYSEC-2024-110 (CVE in 1.3/1.4)
    "scikit-learn>=1.5",

    # Spatial analysis
    "geopandas>=0.14",
    "libpysal>=4.7",
    "esda>=2.5",
    "mgwr>=2.2",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "rasterstats>=0.19",
    "planetary-computer>=1.0",

    # Modeling
    "optuna>=3.3",
    "pygam>=0.9",

    # Deep learning
    "torch>=2.0",

    # CMA-ES hyperparameter optimization (V2)
    "cma>=3.0",

    # Causal inference
    # cap dowhy at <0.12: that version introduced a numba dependency which
    # pulls in llvmlite; llvmlite 0.47+ has no prebuilt wheels for macOS
    # x86_64 / Windows x64 and requires a full LLVM toolchain to build.
    "dowhy>=0.11,<0.12",
    "networkx>=3.1",
    # cap econml at <0.16: 0.16 introduced sparse>=0.18 which requires numba;
    # same llvmlite build-from-source problem as dowhy>=0.12.
    "econml>=0.15,<0.16",
    # Belt-and-suspenders: if any dep pulls numba in, keep it on a version
    # whose llvmlite ships prebuilt wheels (llvmlite<0.44 → numba<0.61).
    "numba<0.61; python_version < '4'",
    "causal-learn>=0.1.3.8",
    "tigramite>=5.2",

    # Visualization & reporting
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",

    # Utilities
    "joblib>=1.3",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "jsonschema>=4.19",
    "pyarrow>=14.0",
]

[project.urls]
"Engine Releases" = "https://github.com/Kyle-Wire/sparc-status/releases"

[project.optional-dependencies]
server = [
    # fastapi 0.136.3 was flagged as a malicious PyPI upload (MAL-2026-4750)
    "fastapi>=0.111,!=0.136.3",
    "uvicorn[standard]>=0.29",
    "python-jose[cryptography]>=3.3",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]
dask = [
    "dask[dataframe]>=2024.1",
    "dask-geopandas>=0.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
sparc = "sparc.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sparc*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.json", "*.csv"]
"sparc" = ["templates/**/*.yml", "templates/**/*.yaml", "templates/**/*.json", "templates/**/*.csv", "templates/**/*.py", "templates/**/.gitkeep", "templates/**/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests as integration tests (may be slow)",
    "network: marks tests that require external network access (OSF, APIs)",
]
