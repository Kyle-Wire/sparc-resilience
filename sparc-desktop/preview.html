<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SPARC Labs — Desktop Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@19/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@19/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
/* ── SPARC Labs Design Tokens ── */
:root {
  --purple:#602468; --magenta:#9e337d; --pink:#e94d9b; --red:#e94461;
  --crimson:#e73c25; --orange:#e76c25; --amber:#e79024; --gold:#f0b632; --yellow:#fbdd46;
  --ink:#1a1416; --ink-2:#2b2327; --paper:#f7f4ee; --paper-2:#ede8dd;
  --line:#c9c2b3; --muted:#6e6358;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{width:100%;height:100%;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;background:#d8d3c6;color:var(--ink);position:relative}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 20% 30%,rgba(231,60,37,.06) 0%,transparent 60%),
  radial-gradient(ellipse at 80% 70%,rgba(96,36,104,.08) 0%,transparent 60%),
  repeating-linear-gradient(rgba(0,0,0,.03) 0 1px,transparent 1px 24px),
  repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 24px)}
#root{position:relative;z-index:1}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
button{font-family:inherit}
.scroll::-webkit-scrollbar{width:10px;height:10px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:2px solid var(--paper)}
input[type=text],input[type=password]{outline:none}
@keyframes loadBar{from{transform:translateX(-100%)}to{transform:translateX(0)}}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-type="module">
const {useState,useEffect,useCallback,useRef,useMemo,createElement:h}=React;

/* ═══════════════════ DESIGN TOKENS ═══════════════════ */
const SPARC_RAMP_HEX=["#602468","#9e337d","#e94d9b","#e94461","#e73c25","#e76c25","#e79024","#f0b632","#fbdd46"];

const TEMPLATE_COLORS={
  uhi:"var(--crimson)",forcesmip:"var(--purple)",groundwater:"#9e337d",
  air_quality:"var(--amber)",stormwater:"#e94d9b",coastal:"#e94461",
  geotechnical:"#e76c25",seismic:"var(--gold)",noise:"var(--muted)",
  wildfire:"var(--crimson)",drought:"var(--amber)",water_quality:"var(--purple)",
};

/* ═══════════════════ DESIGN SYSTEM ═══════════════════ */
function Card({title,subtitle,actions,children,padding=16,style={}}){
  return h('div',{style:{background:'#fff',border:'1px solid var(--line)',borderRadius:8,display:'flex',flexDirection:'column',...style}},
    (title||actions)&&h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid var(--line)',background:'#fdfbf7',borderRadius:'8px 8px 0 0'}},
      h('div',{style:{flex:1,minWidth:0}},
        title&&h('div',{style:{fontSize:12,fontWeight:700,letterSpacing:'-0.01em'}},title),
        subtitle&&h('div',{className:'mono',style:{fontSize:10,color:'var(--muted)',marginTop:2}},subtitle)
      ),actions),
    h('div',{style:{padding,flex:1,minHeight:0}},children)
  );
}

function SectionHeader({kicker,label,right}){
  return h('div',{style:{display:'flex',alignItems:'flex-end',justifyContent:'space-between',marginBottom:14}},
    h('div',null,
      h('div',{className:'mono',style:{fontSize:10,color:'var(--muted)',letterSpacing:'0.16em',textTransform:'uppercase'}},kicker),
      h('div',{style:{fontSize:22,fontWeight:800,letterSpacing:'-0.02em',marginTop:3}},label)),right);
}

function Tag({color='var(--ink)',children}){
  return h('span',{className:'mono',style:{fontSize:9.5,padding:'2px 6px',borderRadius:3,background:`${color}22`,color,letterSpacing:'0.06em',textTransform:'uppercase',fontWeight:600}},children);
}

function Stat({label,value,tint='var(--ink)',sub}){
  return h('div',{style:{border:'1px solid var(--line)',borderRadius:8,padding:'10px 14px',background:'#fff',position:'relative',overflow:'hidden'}},
    h('div',{className:'mono',style:{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.12em',textTransform:'uppercase'}},label),
    h('div',{style:{fontSize:22,fontWeight:700,letterSpacing:'-0.02em',color:tint,marginTop:2}},value),
    sub&&h('div',{className:'mono',style:{fontSize:10,color:'var(--muted)',marginTop:2}},sub));
}

function StatGrid({children}){return h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:10,marginBottom:14}},children)}

function Btn({children,primary,small,onClick,disabled}){
  return h('button',{onClick,disabled,style:{border:'1px solid '+(primary?'var(--ink)':'var(--line)'),background:primary?'var(--ink)':'#fff',color:primary?'#fff':'var(--ink-2)',padding:small?'4px 10px':'7px 14px',fontSize:small?11:12,fontWeight:600,borderRadius:5,cursor:disabled?'not-allowed':'pointer',fontFamily:'inherit',opacity:disabled?.5:1}},children);
}

function KeyVal({label,value}){
  return h('div',null,
    h('div',{className:'mono',style:{fontSize:9.5,color:'var(--muted)',letterSpacing:'0.1em',textTransform:'uppercase'}},label),
    h('div',{style:{fontSize:13,fontWeight:600,marginTop:3}},value));
}

const thStyle={padding:'6px 8px',fontWeight:600,fontSize:10,letterSpacing:'0.1em',textTransform:'uppercase',textAlign:'left'};
const tdStyle={padding:'7px 8px',fontSize:12};

/* ═══════════════════ TOPBAR ═══════════════════ */
function StatusPill({color,label,value}){
  return h('div',{className:'mono',style:{display:'flex',alignItems:'center',gap:6,fontSize:10,color:'var(--muted)'}},
    h('span',{style:{width:6,height:6,borderRadius:'50%',background:color}}),
    h('span',{style:{letterSpacing:'0.1em',textTransform:'uppercase'}},label),
    h('span',{style:{color:'var(--ink-2)'}},value));
}

function Topbar({page}){
  return h('div',{style:{height:42,flexShrink:0,display:'flex',alignItems:'center',borderBottom:'1px solid var(--line)',background:'#fdfbf7',paddingRight:10}},
    h('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'0 16px',flex:1}},
      h('span',{className:'mono',style:{fontSize:10,color:'var(--muted)',letterSpacing:'0.12em',textTransform:'uppercase'}},'sparc · pipeline'),
      h('span',{style:{fontSize:11,color:'var(--line)'}},'/'),
      h('span',{style:{fontSize:12,fontWeight:600}},page)),
    h('div',{style:{display:'flex',alignItems:'center',gap:16}},
      h(StatusPill,{color:'var(--crimson)',label:'Sidecar',value:'preview'}),
      h(StatusPill,{color:'var(--amber)',label:'GPU',value:'CUDA · 11.8'}),
      h(StatusPill,{color:'var(--purple)',label:'Claude',value:'sonnet-4.6'})));
}

/* ═══════════════════ SIDEBAR ═══════════════════ */
const SECTIONS=[
  {label:'Setup',pages:['Project','Data','Processing']},
  {label:'Analysis',pages:['DAG','Variables','Physics','CRS','Scenarios','Models']},
  {label:'Pipeline',pages:['Run','Results','Report']},
];

function Sidebar({currentPage,onNavigate,projectLoaded,projectName,projectDomain,projectEpsg,chatOpen,onToggleChat}){
  let idx=0;
  return h('aside',{style:{width:224,flexShrink:0,height:'100%',display:'flex',flexDirection:'column',background:'#fdfbf7',borderRight:'1px solid var(--line)'}},
    // Brand
    h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'14px 16px',borderBottom:'1px solid var(--line)'}},
      h('div',{style:{width:40,height:40,display:'flex',alignItems:'center',justifyContent:'center'}},
        h('img',{src:'data:image/svg+xml;utf8,'+encodeURIComponent('<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="14" height="14" rx="2" fill="#e73c25"/><rect x="22" y="4" width="14" height="14" rx="2" fill="#602468"/><rect x="4" y="22" width="14" height="14" rx="2" fill="#e79024"/><rect x="22" y="22" width="14" height="14" rx="2" fill="#9e337d"/></svg>'),style:{width:40,height:40}})),
      h('div',{style:{display:'flex',flexDirection:'column',lineHeight:1,gap:3}},
        h('span',{style:{fontSize:13,fontWeight:800,letterSpacing:'-0.01em'}},'SPARC'),
        h('span',{style:{fontSize:9.5,fontWeight:600,letterSpacing:'0.18em',color:'var(--muted)'}},'LABS'))),
    // Project pill
    h('div',{style:{padding:'10px 12px 4px'}},
      h('div',{style:{border:'1px dashed var(--line)',background:'#fff',borderRadius:8,padding:'8px 10px'}},
        h('div',{className:'mono',style:{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.12em'}},'active project'),
        h('div',{style:{fontSize:12,fontWeight:700,marginTop:3,display:'flex',alignItems:'center',gap:6}},
          h('span',{style:{width:6,height:6,borderRadius:'50%',background:projectLoaded?'var(--crimson)':'var(--muted)'}}),
          projectLoaded&&projectName?projectName:'No project'),
        projectLoaded&&(projectDomain||projectEpsg)&&h('div',{className:'mono',style:{fontSize:10,color:'var(--muted)',marginTop:2}},
          projectDomain,projectDomain&&projectEpsg?' · ':'',projectEpsg?'EPSG:'+projectEpsg:''))),
    // Nav
    h('nav',{className:'scroll',style:{flex:1,overflowY:'auto',padding:'6px 0 12px'}},
      SECTIONS.map((section,si)=>h('div',{key:section.label,style:{marginTop:si===0?4:10}},
        h('div',{style:{padding:'4px 18px',fontSize:9.5,fontWeight:700,letterSpacing:'0.16em',color:'var(--muted)',textTransform:'uppercase',display:'flex',justifyContent:'space-between',alignItems:'center'}},
          h('span',null,section.label),
          h('span',{className:'mono',style:{fontSize:9,opacity:.6}},String(si+1).padStart(2,'0'))),
        section.pages.map(p=>{
          const n=++idx;const active=p===currentPage;
          const disabled=p!=='Project'&&!projectLoaded;
          return h('button',{key:p,onClick:()=>!disabled&&onNavigate(p),
            onMouseEnter:e=>{if(!active&&!disabled)e.currentTarget.style.background='rgba(0,0,0,0.05)'},
            onMouseLeave:e=>{if(!active&&!disabled)e.currentTarget.style.background='transparent'},
            style:{display:'flex',alignItems:'center',gap:10,width:'100%',textAlign:'left',border:'none',padding:'7px 12px 7px 16px',fontFamily:'inherit',fontSize:13,cursor:disabled?'default':'pointer',background:active?'var(--ink)':'transparent',color:active?'#fff':disabled?'var(--muted)':'var(--ink-2)',fontWeight:active?600:500,opacity:disabled?.5:1,transition:'background 0.15s'}},
            h('span',{className:'mono',style:{display:'inline-flex',alignItems:'center',justifyContent:'center',width:20,height:18,borderRadius:3,fontSize:10,fontWeight:600,background:active?'var(--crimson)':'rgba(0,0,0,0.06)',color:active?'#fff':'var(--muted)'}},String(n).padStart(2,'0')),
            p);})))),
    // Assistant
    h('div',{style:{borderTop:'1px solid var(--line)',padding:8}},
      h('button',{onClick:onToggleChat,style:{display:'flex',alignItems:'center',gap:10,width:'100%',textAlign:'left',padding:'8px 10px',borderRadius:6,border:'1px solid '+(chatOpen?'var(--ink)':'transparent'),background:chatOpen?'var(--ink)':'transparent',color:chatOpen?'#fff':'var(--ink-2)',fontSize:12.5,fontWeight:600,cursor:'pointer',fontFamily:'inherit'}},
        h('span',{style:{width:18,height:18,display:'inline-flex',alignItems:'center',justifyContent:'center'},dangerouslySetInnerHTML:{__html:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12v7H9l-3 3v-3H2V4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>'}}),
        'Assistant',
        h('span',{className:'mono',style:{marginLeft:'auto',fontSize:9,letterSpacing:'0.08em',padding:'2px 6px',borderRadius:3,background:chatOpen?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.06)'}},'⌘K'))));
}

/* ═══════════════════ SHELL ═══════════════════ */
function Shell({currentPage,onNavigate,children,projectLoaded,projectName,projectDomain,projectEpsg,chatOpen,onToggleChat}){
  return h('div',{style:{width:'100%',height:'100%',display:'flex',background:'var(--paper)'}},
    h(Sidebar,{currentPage,onNavigate,projectLoaded,projectName,projectDomain,projectEpsg,chatOpen,onToggleChat}),
    h('div',{style:{flex:1,display:'flex',flexDirection:'column',minWidth:0}},
      h(Topbar,{page:currentPage}),
      h('main',{className:'scroll',style:{flex:1,overflow:'auto',padding:'20px 22px',background:'var(--paper)',backgroundImage:'linear-gradient(rgba(0,0,0,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.035) 1px,transparent 1px)',backgroundSize:'24px 24px',position:'relative'}},children)));
}

/* ═══════════════════ PAGE: PROJECT ═══════════════════ */
function ProjectPage({onProjectLoaded}){
  const cfg={project:{name:'providence_ri_uhi',domain:'uhi',version:'2.1'},data:{file_path:'brown4.csv',target_column:'AAT_z'},crs:{input:'4326',projected:'3438'},predictors:['tree_canopy_pct','impervious_pct','albedo','building_height','ndvi','elevation','dist_coast'],pipeline:{random_seed:42,fast_mode:false},flags:{use_gwen:true,use_laplacian:true}};
  const [yamlOpen,setYamlOpen]=useState(false);
  const yamlPreview=`project:\n  name: ${cfg.project.name}\n  domain: ${cfg.project.domain}\n  version: ${cfg.project.version}\ndata:\n  path: ${cfg.data.file_path}\n  target_column: ${cfg.data.target_column}\ncrs:\n  input_epsg: ${cfg.crs.input}\n  projected_epsg: ${cfg.crs.projected}\npredictors:\n${cfg.predictors.map(p=>'  - '+p).join('\n')}\nflags:\n  use_gwen: true\n  use_laplacian: true`;

  return h('div',null,
    h(SectionHeader,{kicker:'01 · setup',label:'Project',right:h('div',{style:{display:'flex',gap:8}},
      h(Btn,{onClick:()=>onProjectLoaded()},'Open project.yml'),
      h(Btn,{primary:true,onClick:()=>onProjectLoaded()},'New from template'))}),
    h('div',{style:{display:'grid',gridTemplateColumns:'2fr 1fr',gap:14}},
      h(Card,{title:'Active project',subtitle:'uhi · providence_ri_uhi'},
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14}},
          h(KeyVal,{label:'Name',value:'providence_ri_uhi'}),
          h(KeyVal,{label:'Domain',value:h(Tag,{color:'var(--crimson)'},'uhi')}),
          h(KeyVal,{label:'Target',value:'AAT_z'}),
          h(KeyVal,{label:'Data file',value:'brown4.csv'}),
          h(KeyVal,{label:'CRS (in / proj)',value:'EPSG:4326 → 3438'}),
          h(KeyVal,{label:'Target',value:'AAT_z'}),
          h(KeyVal,{label:'Random seed',value:'42'}),
          h(KeyVal,{label:'Pipeline',value:h(Tag,{color:'var(--purple)'},'fast_mode:false')})),
        h('div',{style:{marginTop:14,borderTop:'1px dashed var(--line)',paddingTop:12}},
          h('button',{onClick:()=>setYamlOpen(!yamlOpen),className:'mono',style:{fontSize:10,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:6,background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',padding:0}},'project.yml · preview '+(yamlOpen?'▲':'▼')),
          yamlOpen&&h('pre',{className:'mono',style:{fontSize:10.5,margin:0,lineHeight:1.6,color:'var(--ink-2)'}},yamlPreview))),
      h(Card,{title:'Templates',subtitle:'12 domains available'},
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}},
          Object.entries(TEMPLATE_COLORS).map(([k,c])=>h('button',{key:k,style:{textAlign:'left',border:'1px solid '+(k==='uhi'?'var(--amber)':'var(--line)'),background:k==='uhi'?'#fff8ef':'#fff',borderRadius:5,padding:'7px 9px',cursor:'pointer',fontFamily:'inherit'}},
            h('div',{className:'mono',style:{fontSize:9,color:c,letterSpacing:'0.08em',textTransform:'uppercase'}},k),
            h('div',{style:{fontSize:11,fontWeight:600,color:'var(--ink-2)',marginTop:1}},k.replace(/_/g,' '))))))));
}

/* ═══════════════════ PAGE: DATA ═══════════════════ */
function DataPage(){
  const cols=['FID','POINT_X','POINT_Y','AAT_z','tree_canopy_pct','impervious_pct','albedo','building_height','ndvi','elevation','dist_coast','pop_density'];
  const roles={AAT_z:{tag:'Target',color:'var(--crimson)'},POINT_X:{tag:'Coord',color:'var(--purple)'},POINT_Y:{tag:'Coord',color:'var(--purple)'},FID:{tag:'ID',color:'var(--muted)'}};
  return h('div',null,
    h(SectionHeader,{kicker:'02 · setup',label:'Data',right:h(Btn,{small:true},'Upload CSV')}),
    h(StatGrid,null,h(Stat,{label:'Rows',value:'2,847'}),h(Stat,{label:'Columns',value:'12'}),h(Stat,{label:'Missing',value:'0.18%',tint:'var(--purple)'}),h(Stat,{label:'Spatial density',value:'≈0.1 / 30m²',tint:'var(--crimson)'})),
    h(Card,{title:'Schema',subtitle:'2847 rows · 12 columns'},
      h('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:12}},
        h('thead',null,h('tr',{style:{textAlign:'left',color:'var(--muted)'}},
          h('th',{style:thStyle},'#'),h('th',{style:thStyle},'Column'),h('th',{style:thStyle},'Type'),h('th',{style:thStyle},'Summary'),h('th',{style:thStyle},'Role'))),
        h('tbody',null,cols.map((c,i)=>{
          const r=roles[c]||{tag:'Predictor',color:'var(--ink-2)'};
          return h('tr',{key:c,style:{borderTop:'1px solid var(--line)'}},
            h('td',{style:{...tdStyle,color:'var(--muted)'},className:'mono'},String(i).padStart(2,'0')),
            h('td',{style:{...tdStyle,fontWeight:600}},c),
            h('td',{style:tdStyle},h('span',{className:'mono',style:{fontSize:10,color:'var(--purple)'}},'float')),
            h('td',{style:{...tdStyle,color:'var(--muted)'},className:'mono'},'0.00 … 1.00'),
            h('td',{style:tdStyle},h(Tag,{color:r.color},r.tag)));
        })))));
}

/* ═══════════════════ PAGE: PROCESSING ═══════════════════ */
function ProcessingPage(){
  const [pathway,setPathway]=useState('preprocessed');
  const steps=[{id:1,name:'Ingest CSV',status:'done'},{id:2,name:'Reproject CRS',status:'done'},{id:3,name:'Deduplicate coords',status:'done'},{id:4,name:'Impute missing',status:'done'},{id:5,name:'Derive features',status:'done'},{id:6,name:'Standardise (z-score)',status:'done'},{id:7,name:'Spatial block split',status:'running'},{id:8,name:'Write cached arrow',status:'queued'}];
  return h('div',null,
    h(SectionHeader,{kicker:'03 · setup',label:'Processing',right:h('div',{style:{display:'flex',gap:8}},h(Btn,{small:true},'Revert'),h(Btn,{primary:true,small:true},'Apply all'))}),
    h('div',{style:{display:'flex',gap:4,marginBottom:14}},
      ['preprocessed','spatial'].map(p=>h('button',{key:p,onClick:()=>setPathway(p),style:{border:'1px solid '+(pathway===p?'var(--ink)':'var(--line)'),background:pathway===p?'var(--ink)':'#fff',color:pathway===p?'#fff':'var(--ink-2)',fontSize:11,padding:'5px 12px',borderRadius:4,fontFamily:'inherit',fontWeight:600,cursor:'pointer'}},p==='preprocessed'?'Preprocessed Data':'Spatial Data Builder'))),
    h(StatGrid,null,h(Stat,{label:'Input Rows',value:'2,847'}),h(Stat,{label:'After Clean',value:'2,839',tint:'var(--purple)',sub:'-8 duplicates'}),h(Stat,{label:'Missing Filled',value:'142',tint:'var(--amber)',sub:'k-NN · 0.42% of cells'}),h(Stat,{label:'Derived Features',value:'+4',tint:'var(--crimson)',sub:'16 total'})),
    h(Card,{title:'Transformation pipeline',subtitle:'applied left-to-right · fold-aware where marked'},

        h('span',{className:'mono',style:{display:'inline-flex',alignItems:'center',justifyContent:'center',width:26,height:26,borderRadius:4,background:s.status==='done'?'var(--ink)':s.status==='running'?'var(--crimson)':'rgba(0,0,0,0.05)',color:s.status==='queued'?'var(--muted)':'#fff',fontSize:11,fontWeight:700}},s.id),
        h('div',null,h('div',{style:{fontSize:12.5,fontWeight:600}},s.name),s.status==='running'&&h('div',{style:{height:4,background:'rgba(0,0,0,0.05)',borderRadius:2,marginTop:4,overflow:'hidden'}},h('div',{style:{width:'60%',height:'100%',background:'var(--crimson)',animation:'loadBar 1.3s ease-out infinite'}}))),
        h(Tag,{color:s.status==='done'?'var(--ink)':s.status==='running'?'var(--crimson)':'var(--muted)'},s.status)))));
}

/* ═══════════════════ PAGE: DAG ═══════════════════ */
function DAGPage(){
  const nodes=[{id:'tree_canopy',type:'treatment',label:'Tree Canopy',x:80,y:60},{id:'impervious',type:'treatment',label:'Impervious',x:80,y:180},{id:'albedo',type:'treatment',label:'Albedo',x:80,y:300},{id:'building_density',type:'mediator',label:'Building Density',x:340,y:120},{id:'elevation',type:'confounder',label:'Elevation',x:340,y:240},{id:'dist_coast',type:'confounder',label:'Dist to Coast',x:340,y:350},{id:'aat_z',type:'outcome',label:'AAT_z',x:580,y:200}];
  const edges=[['tree_canopy','aat_z'],['impervious','aat_z'],['impervious','building_density'],['albedo','aat_z'],['building_density','aat_z'],['elevation','aat_z'],['elevation','tree_canopy'],['dist_coast','aat_z']];

  const svgRef=useRef(null);
  useEffect(()=>{
    // Draw edges on SVG
  },[]);

  return h(Shell,{currentPage:page==='Settings'?'Project':page,onNavigate:setPage,projectLoaded,projectName:'providence_ri_uhi',projectDomain:'uhi',projectEpsg:'3438',chatOpen,onToggleChat:()=>setChatOpen(!chatOpen)},renderPage());
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
