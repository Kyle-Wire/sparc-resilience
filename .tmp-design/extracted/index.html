<script type="text/babel" data-presets="react">
// ===== src/cube_logo.jsx =====
// Animated SPARC cube logo.
// The cube contains "matter" — flowing dashed contour rings + particles — that
// moves around inside the isometric cube bounds.
//
// Geometry matches the official logo (viewBox around 138 48 516 516).
// Cube vertices (projected 2D):
//   TOP:    (396, 72)
//   TL:     (195, 190)   — top-left face
//   TR:     (597, 190)   — top-right face
//   C:      (396, 313)   — centre (where all three top edges meet the middle diamond)
//   BL:     (195, 418)
//   BR:     (597, 418)
//   BOT:    (396, 540)

const { useEffect, useRef, useMemo } = React;

// ------- Utility: noise-like pseudo-random field (for organic motion) -------
function hash(x, y, z) {
  const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return s - Math.floor(s);
}

// ------- Point in cube hexagon (2D silhouette) -------
// The cube projects to a hexagon; the three visible faces are three rhombi meeting at C.
const HEX = [
  [396, 72],   // top
  [597, 190],  // upper-right
  [597, 418],  // lower-right
  [396, 540],  // bottom
  [195, 418],  // lower-left
  [195, 190],  // upper-left
];
function pointInHex(px, py) {
  let inside = false;
  for (let i = 0, j = HEX.length - 1; i < HEX.length; j = i++) {
    const [xi, yi] = HEX[i];
    const [xj, yj] = HEX[j];
    const intersect = ((yi > py) !== (yj > py)) &&
      (px < ((xj - xi) * (py - yi)) / (yj - yi + 1e-9) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// ------- Isometric mapping: cube coords (u,v,w) in [-1,1]^3 -> 2D projection ----
// axes: u=right (→TR), v=back-left (→TL), w=up
const C = [396, 313];
const AX_U = [ 201, -123 ];   // TR - C
const AX_V = [-201, -123 ];   // TL - C
const AX_W = [   0, -241 ];   // TOP - C
function iso(u, v, w) {
  return [
    C[0] + u * AX_U[0] + v * AX_V[0] + w * AX_W[0],
    C[1] + u * AX_U[1] + v * AX_V[1] + w * AX_W[1],
  ];
}

// ------- CUBE LOGO -------
// Uses the real SPARC logo (imported SVG) with animated interior strokes.
// The "matter" inside the cube is the dashed path set from the brand mark —
// we just animate their stroke-dashoffsets to make it feel alive.
function CubeLogo({ size = 120, animate = true, hue = "ink", density = 1, intensity = 1 }) {
  const stroke = hue === "ink" ? "#1a1416" :
                 hue === "red" ? "#e73c25" :
                 hue === "purple" ? "#602468" :
                 hue === "amber" ? "#e79024" :
                 hue === "crimson" ? "#b52a2a" : "#1a1416";

  // A small CSS block scoped by a unique id gives per-instance hue + animation.
  const uid = useMemo(() => "cl-" + Math.random().toString(36).slice(2, 8), []);
  const dur = animate ? (6 / Math.max(0.4, intensity)) : 0;

  // Groups of dashed paths in the logo — each group gets its own stroke-dasharray
  // timing so the matter shimmers unevenly.
  const css = `
    #${uid} .cube-frame { stroke: ${stroke}; stroke-width: 7.56px; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    #${uid} .cube-core  { fill: #ffffff; stroke: ${stroke}; stroke-width: 4.54px; stroke-linejoin: round; }
    #${uid} .cube-poly  { stroke: ${stroke}; stroke-width: 7.56px; stroke-linejoin: round; fill: none; }
    #${uid} .cube-tick  { stroke: #ffffff; stroke-width: 7.56px; stroke-linecap: round; fill: none; }
    #${uid} .matter     { stroke: ${stroke}; stroke-width: 2.27px; stroke-linecap: round; fill: none; }
    #${uid} .matter-a   { stroke-dasharray: 4 6; animation: ${uid}-flow-a ${dur}s linear infinite; }
    #${uid} .matter-b   { stroke-dasharray: 3 5; animation: ${uid}-flow-b ${dur * 1.3}s linear infinite; }
    #${uid} .matter-c   { stroke-dasharray: 6 4; animation: ${uid}-flow-c ${dur * 0.7}s linear infinite reverse; }
    #${uid} .matter-d   { stroke-dasharray: 2 7; animation: ${uid}-flow-a ${dur * 1.6}s linear infinite; }
    #${uid} .matter-tip { stroke: ${stroke}; stroke-width: 2.27px; stroke-linecap: round; fill: none; }
    #${uid} .core       { transform-origin: 380px 335px; animation: ${uid}-breath ${dur * 1.2}s ease-in-out infinite; }
    @keyframes ${uid}-flow-a { to { stroke-dashoffset: -100; } }
    @keyframes ${uid}-flow-b { to { stroke-dashoffset: -80; } }
    @keyframes ${uid}-flow-c { to { stroke-dashoffset: -120; } }
    @keyframes ${uid}-breath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  `;

  return (
    <div id={uid} style={{ width: size, height: size, position: "relative", display: "inline-block" }}>
      <style>{css}</style>
      <svg viewBox="138 48 516 516" xmlns="http://www.w3.org/2000/svg" style={{ width: "100%", height: "100%", display: "block" }}>

        {/* Hex cube frame */}
        <polygon className="cube-poly" points="396.26 71.88 194.84 189.71 194.84 418.23 396.26 540.12 597.16 419.61 597.16 189.77 396.26 71.88" />
        <polyline className="cube-poly" points="194.84 189.71 396.26 313.66 597.16 189.77" />
        <line className="cube-poly" x1="396.26" y1="540.12" x2="396.26" y2="313.66" />

        {/* White accent ticks */}
        <line className="cube-tick" x1="396.26" y1="71.88" x2="396.26" y2="145.57" />
        <line className="cube-tick" x1="597.16" y1="419.61" x2="509.68" y2="367.94" />
        <line className="cube-tick" x1="194.84" y1="418.23" x2="279.26" y2="368.99" />

        {/* Rear polyline (the back face trace) */}
        <polyline className="cube-frame" style={{ opacity: 0.25 }} points="397.85 540.12 592.39 418.14 408.64 312.98 284.67 366.5 199.61 418.59" />

        {/* Matter — the dashed flowing interior paths */}
        <g>
          <path className="matter matter-a" d="M246.87,295.28c8.16,6.16,16.55,12.8,25.1,19.97,12.27,10.29,15.52,15.66,27.23,24.2,8.31,6.06,14.86,10.76,24.96,14.37,3.44,1.23,14.89,5.05,30.25,4.54,4.95-.17,16.16-.98,28.74-6.05,9.55-3.85,18.2-9.48,43.86-36.3,12.28-12.84,15.65-19.25,30.25-33.27,4.99-4.8,9.43-8.73,12.82-11.65" />
          <path className="matter matter-b" d="M254.97,260.03c4.77,4.31,11.05,10.4,17.76,18.16,15.72,18.17,16.54,25.53,28.74,34.79,4.07,3.09,16.71,11.93,34.79,13.61,19.08,1.78,33.62-5.4,40.84-9.07,18.79-9.58,19.81-18.3,45.37-42.35,13.55-12.75,26.78-25.19,45.37-34.79,20.02-10.33,39.47-13.87,54.44-14.94" />
          <path className="matter matter-c" d="M256.54,259.89c7.73,6.29,14.8,11.34,20.73,15.27,14.7,9.76,22.25,14.65,31.76,15.12,10.67.54,18.84-3.87,25.71-7.56,7.58-4.08,13.15-8.75,28.74-25.71,21.68-23.59,21.25-25.81,31.76-34.79,6.07-5.19,15.69-13.28,30.25-19.66,14.84-6.51,28.42-8.44,37.84-8.95" />
          <path className="matter matter-d" d="M323.8,388.79c8.21,3.12,20.4,6.43,35.15,5.86,26.59-1.04,45.21-14.09,52.94-19.66,8.38-6.04,8.82-8.16,39.32-42.35,23.49-26.33,27.03-29.32,30.25-31.76,11.14-8.45,27.45-17.07,51.45-20.75" />
          <line className="matter matter-a" x1="274.25" y1="358.41" x2="274.25" y2="282.7" />
          <path className="matter matter-b" d="M299.78,258.29c2.23,7.26,5.48,18.19,7.74,27.46,2.36,9.68,3.87,14.48,4.54,21.17,1.51,15.12,1.37,17.91,1.51,36.3.02,2.03,0,1.23,0,28.74v9.09" />
          <path className="matter matter-c" d="M332.52,217.64c3.4,19.21,6.17,35.62,8.28,48.45,4.4,26.74,6.61,40.34,7.56,51.42,1.17,13.68,1.02,20,3.02,37.81.91,8.11,2.12,15.49,4.54,30.25,3.37,20.6,5.49,30.18,13.61,37.81.52.49,2.7,2.51,6.05,4.54,13.31,8.07,27.71,5.82,33.27,4.54,11.2-2.59,18.27-8.58,24.2-13.61,2.7-2.29,9.66-8.49,19.66-24.2,14.16-22.24,11.99-28.3,24.2-43.86,5.54-7.06,11.14-14.05,21.17-19.66,14.84-8.3,29.34-7.96,34.79-7.56,8.37.61,15.17,2.8,19.93,4.81" />
          <path className="matter matter-a" d="M364.11,173.77c5.51,38.99,10.7,70.44,14.5,92.32,7.4,42.66,7.5,37.5,10.59,58.99,4.17,29.01,5.35,47.98,13.61,75.62,2.91,9.73,7.26,22.45,16.64,36.3,5.08,7.51,10.28,13.34,14.49,17.56" />

  );
}

window.CubeLogo = CubeLogo;


// ===== src/sidebar.jsx =====
// Sidebar + Topbar + Window chrome for the SPARC desktop app.

const SECTIONS = [
  { label: "Setup", pages: ["Project", "Data", "Processing"] },
  { label: "Analysis", pages: ["DAG", "Variables", "Physics", "CRS", "Scenarios", "Models"] },
  { label: "Pipeline", pages: ["Run", "Results", "Report"] },
];

function Sidebar({ currentPage, onNavigate, onToggleChat, chatOpen }) {
  let idx = 0;
  return (
    <aside style={{
      width: 240, flexShrink: 0, height: "100%",
      display: "flex", flexDirection: "column",
      background: "#fdfbf7",
      borderRight: "1px solid var(--line)",
    }}>
      {/* Brand lockup */}
      <div style={{
        display: "flex", alignItems: "center", gap: 12,
        padding: "14px 16px",
        borderBottom: "1px solid var(--line)",
      }}>
        <div style={{ width: 64, height: 64, marginTop: -2, marginLeft: -6 }}>
          <CubeLogo size={64} density={0.7} />
        </div>
        <div style={{ display: "flex", flexDirection: "column", lineHeight: 1, gap: 4 }}>
          <span style={{ fontSize: 15, fontWeight: 800, letterSpacing: "-0.01em" }}>SPARC</span>
          <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.2em", color: "var(--muted)" }}>LABS</span>
        </div>
      </div>

      {/* Project pill */}
      <div style={{ padding: "10px 12px 4px" }}>
        <div style={{
          border: "1px dashed var(--line)",
          background: "#fff",
          borderRadius: 8,
          padding: "8px 10px",
        }}>
          <div className="mono" style={{ fontSize: 9, color: "var(--muted)", textTransform: "uppercase", letterSpacing: "0.12em" }}>
            active project
          </div>
          <div style={{ fontSize: 12, fontWeight: 700, marginTop: 3, display: "flex", alignItems: "center", gap: 6 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--crimson)" }}></span>
            Brown UHI — 30m
          </div>
          <div className="mono" style={{ fontSize: 10, color: "var(--muted)", marginTop: 2 }}>uhi · EPSG:3438</div>
        </div>
      </div>

      {/* Navigation */}
      <nav className="scroll" style={{ flex: 1, overflowY: "auto", padding: "6px 0 12px" }}>
        {SECTIONS.map((section, si) => (
          <div key={section.label} style={{ marginTop: si === 0 ? 4 : 10 }}>
            <div style={{
              padding: "4px 18px",
              fontSize: 9.5, fontWeight: 700,
              letterSpacing: "0.16em",
              color: "var(--muted)",
              textTransform: "uppercase",
              display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
              <span>{section.label}</span>
              <span className="mono" style={{ fontSize: 9, opacity: 0.6 }}>{String(si + 1).padStart(2, "0")}</span>
            </div>
            {section.pages.map((p) => {
              const n = ++idx;
              const active = p === currentPage;
              return (
                <button
                  key={p}
                  onClick={() => onNavigate(p)}
                  style={{
                    display: "flex", alignItems: "center", gap: 10,
                    width: "100%", textAlign: "left", border: "none",
                    padding: "7px 12px 7px 16px",
                    fontFamily: "inherit",
                    fontSize: 13,
                    cursor: "pointer",
                    background: active ? "var(--ink)" : "transparent",
                    color: active ? "#fff" : "var(--ink-2)",
                    fontWeight: active ? 600 : 500,
                    transition: "background 0.15s",
                  }}
                  onMouseEnter={(e) => { if (!active) e.currentTarget.style.background = "rgba(0,0,0,0.05)"; }}
                  onMouseLeave={(e) => { if (!active) e.currentTarget.style.background = "transparent"; }}
                >
                  <span className="mono" style={{
                    display: "inline-flex", alignItems: "center", justifyContent: "center",
                    width: 20, height: 18, borderRadius: 3,
                    fontSize: 10, fontWeight: 600,
                    background: active ? "var(--crimson)" : "rgba(0,0,0,0.06)",
                    color: active ? "#fff" : "var(--muted)",
                  }}>{String(n).padStart(2, "0")}</span>
                  {p}
                </button>
              );
            })}
          </div>
        ))}
      </nav>

      {/* AI assistant + settings */}
      <div style={{ borderTop: "1px solid var(--line)", padding: 8 }}>
        <button
          onClick={onToggleChat}
          style={{
            display: "flex", alignItems: "center", gap: 10,
            width: "100%", textAlign: "left",
            padding: "8px 10px", borderRadius: 6,
            border: "1px solid " + (chatOpen ? "var(--ink)" : "transparent"),
            background: chatOpen ? "var(--ink)" : "transparent",
            color: chatOpen ? "#fff" : "var(--ink-2)",
            fontSize: 12.5, fontWeight: 600, cursor: "pointer",
            fontFamily: "inherit",
          }}
        >
          <span style={{ width: 18, height: 18, display: "inline-flex", alignItems: "center", justifyContent: "center" }}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4h12v7H9l-3 3v-3H2V4z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/>
            </svg>
          </span>
          Assistant
          <span className="mono" style={{
            marginLeft: "auto", fontSize: 9, letterSpacing: "0.08em",
            padding: "2px 6px", borderRadius: 3,
            background: chatOpen ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.06)",
          }}>⌘K</span>
        </button>
      </div>
    </aside>
  );
}

function Topbar({ page, status }) {
  return (
    <div style={{
      height: 42, flexShrink: 0,
      display: "flex", alignItems: "center",
      borderBottom: "1px solid var(--line)",
      background: "#fdfbf7",
      paddingRight: 10,
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "0 16px", flex: 1 }}>
        <span className="mono" style={{ fontSize: 10, color: "var(--muted)", letterSpacing: "0.12em", textTransform: "uppercase" }}>
          sparc · pipeline
        </span>
        <span style={{ fontSize: 11, color: "var(--line)" }}>/</span>
        <span style={{ fontSize: 12, fontWeight: 600 }}>{page}</span>
      </div>

      <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
        <StatusPill color="var(--crimson)" label="Sidecar" value="ready · :17123" />
        <StatusPill color="var(--amber)" label="GPU" value="CUDA · 11.8" />
        <StatusPill color="var(--purple)" label="Claude" value="haiku-4.5" />
      </div>
    </div>
  );
}

function StatusPill({ color, label, value }) {
  return (
    <div className="mono" style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 10, color: "var(--muted)" }}>
      <span style={{ width: 6, height: 6, borderRadius: "50%", background: color }}></span>
      <span style={{ letterSpacing: "0.1em", textTransform: "uppercase" }}>{label}</span>
      <span style={{ color: "var(--ink-2)" }}>{value}</span>
    </div>

// Results view — charts + spatial map preview using canvas.

const { useEffect: useEffectR, useRef: useRefR, useState: useStateR } = React;

const SPARC_HEX = ["#602468", "#9e337d", "#e94d9b", "#e94461", "#e73c25", "#e76c25", "#e79024", "#f0b632", "#fbdd46"];

// Spatial heatmap — pseudo-UHI temperature field over Providence grid
function SpatialMap({ scenario }) {
  const ref = useRefR(null);
  useEffectR(() => {
    const canvas = ref.current; if (!canvas) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * DPR; canvas.height = h * DPR;
    const ctx = canvas.getContext("2d"); ctx.scale(DPR, DPR);

    // Build a noise field from a few gaussian hotspots
    const hotspots = [
      { x: 0.35, y: 0.45, s: 0.18, a: 1.0 },
      { x: 0.62, y: 0.38, s: 0.14, a: 0.85 },
      { x: 0.78, y: 0.64, s: 0.16, a: 0.7 },
      { x: 0.22, y: 0.72, s: 0.20, a: 0.6 },
      { x: 0.55, y: 0.78, s: 0.12, a: 0.9 },
    ];
    const coolspots = [
      { x: 0.15, y: 0.30, s: 0.18, a: 0.8 },
      { x: 0.85, y: 0.20, s: 0.12, a: 0.7 },
    ];
    const cell = 6;
    // Scenario shift
    const shift = scenario === "canopy+10" ? -0.18
                 : scenario === "impervious-20" ? -0.25
                 : scenario === "albedo+0.1" ? -0.12
                 : 0;

    for (let y = 0; y < h; y += cell) {
      for (let x = 0; x < w; x += cell) {
        const nx = x / w, ny = y / h;
        let v = 0;
        for (const hs of hotspots) {
          const dx = nx - hs.x, dy = ny - hs.y;
          v += hs.a * Math.exp(-(dx*dx + dy*dy) / (2 * hs.s * hs.s));
        }
        for (const cs of coolspots) {
          const dx = nx - cs.x, dy = ny - cs.y;
          v -= cs.a * Math.exp(-(dx*dx + dy*dy) / (2 * cs.s * cs.s));
        }
        v += shift;
        const t = Math.max(0, Math.min(1, (v + 0.5) / 1.6));
        // sample SPARC ramp
        const idx = t * (SPARC_HEX.length - 1);
        const i0 = Math.floor(idx), i1 = Math.min(SPARC_HEX.length - 1, i0 + 1);
        const f = idx - i0;
        const c0 = SPARC_HEX[i0], c1 = SPARC_HEX[i1];
        const r = Math.round(parseInt(c0.slice(1, 3), 16) * (1-f) + parseInt(c1.slice(1, 3), 16) * f);
        const g = Math.round(parseInt(c0.slice(3, 5), 16) * (1-f) + parseInt(c1.slice(3, 5), 16) * f);
        const b = Math.round(parseInt(c0.slice(5, 7), 16) * (1-f) + parseInt(c1.slice(5, 7), 16) * f);
        ctx.fillStyle = `rgba(${r},${g},${b},0.82)`;
        ctx.fillRect(x, y, cell, cell);
      }
    }
    // Overlay street-grid-ish lines
    ctx.strokeStyle = "rgba(0,0,0,0.08)"; ctx.lineWidth = 1;
    for (let i = 0; i < 14; i++) {
      ctx.beginPath(); ctx.moveTo((i/14)*w, 0); ctx.lineTo((i/14)*w + 20, h); ctx.stroke();
    }
    for (let i = 0; i < 10; i++) {
      ctx.beginPath(); ctx.moveTo(0, (i/10)*h); ctx.lineTo(w, (i/10)*h - 12); ctx.stroke();
    }
    // Border dashes (brand)
    ctx.setLineDash([3, 3]); ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, w - 1, h - 1);
  }, [scenario]);
  return <canvas ref={ref} style={{ width: "100%", height: "100%", display: "block" }} />;
}

// Scenario response curve
function ScenarioCurve() {
  const canvas = useRefR(null);
  useEffectR(() => {
    const c = canvas.current; if (!c) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const w = c.clientWidth, h = c.clientHeight;
    c.width = w * DPR; c.height = h * DPR;
    const ctx = c.getContext("2d"); ctx.scale(DPR, DPR);
    const PAD = { l: 36, r: 10, t: 10, b: 22 };
    const xs = [0, 5, 10, 15, 20, 30, 50];
    const canopy = [0, -0.130, -0.258, -0.437, -0.509, -0.608, -0.738];
    const imperv = [0, -0.098, -0.195, null, -0.383, -0.456, -0.550];
    const albedo = [0, -0.098, -0.196, null, -0.384, -0.450, null];
    const xMax = 50, yMin = -0.8, yMax = 0.02;
    const X = (x) => PAD.l + (x / xMax) * (w - PAD.l - PAD.r);
    const Y = (y) => PAD.t + ((yMax - y) / (yMax - yMin)) * (h - PAD.t - PAD.b);
    // axes
    ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PAD.l, PAD.t); ctx.lineTo(PAD.l, h - PAD.b); ctx.lineTo(w - PAD.r, h - PAD.b); ctx.stroke();
    // grid
    for (let y = -0.8; y <= 0; y += 0.2) {
      ctx.strokeStyle = "rgba(0,0,0,0.05)";
      ctx.beginPath(); ctx.moveTo(PAD.l, Y(y)); ctx.lineTo(w - PAD.r, Y(y)); ctx.stroke();
      ctx.fillStyle = "var(--muted)"; ctx.font = "10px JetBrains Mono";
      ctx.textAlign = "right"; ctx.fillText(y.toFixed(1), PAD.l - 6, Y(y) + 3);
    }
    xs.forEach(x => {
      ctx.fillStyle = "var(--muted)"; ctx.font = "10px JetBrains Mono";
      ctx.textAlign = "center"; ctx.fillText(String(x), X(x), h - PAD.b + 13);
    });

    const series = [
      { data: canopy, color: "#602468", label: "Canopy +X pp" },
      { data: imperv, color: "#e73c25", label: "Impervious −X pp" },
      { data: albedo, color: "#e79024", label: "Albedo +X" },
    ];
    for (const s of series) {
      ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
      let started = false;
      xs.forEach((x, i) => {
        if (s.data[i] == null) return;
        const px = X(x), py = Y(s.data[i]);
        if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
      });
      ctx.stroke();
      xs.forEach((x, i) => {
        if (s.data[i] == null) return;
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(X(x), Y(s.data[i]), 3, 0, Math.PI*2); ctx.fill();
      });
    }
    // legend
    const lx = w - 150, ly = 18;
    series.forEach((s, i) => {
      ctx.fillStyle = s.color;
      ctx.fillRect(lx, ly + i*14 - 6, 10, 2);
      ctx.fillStyle = "var(--ink-2)"; ctx.font = "10px JetBrains Mono"; ctx.textAlign = "left";
      ctx.fillText(s.label, lx + 14, ly + i*14);
    });
  }, []);
  return <canvas ref={canvas} style={{ width: "100%", height: 220, display: "block" }} />;
}

function RunPage() {
  const [elapsed, setElapsed] = useStateP(0);     // seconds into the run
  const [playing, setPlaying] = useStateP(true);
  const rafRef = useRef(0);
  const lastRef = useRef(performance.now());

  const totalDur = STAGES.reduce((a, s) => a + s.dur, 0);
  // cumulative start times
  const starts = useMemo(() => {
    const out = []; let t = 0;
    for (const s of STAGES) { out.push(t); t += s.dur; }
    return out;
  }, []);

  useEffect(() => {
    if (!playing) return;
    const tick = () => {
      const now = performance.now();
      const dt = (now - lastRef.current) / 1000;
      lastRef.current = now;
      setElapsed(e => {
        const next = Math.min(totalDur + 2, e + dt * 6); // 6× playback speed
        if (next >= totalDur + 2) setPlaying(false);
        return next;
      });
      rafRef.current = requestAnimationFrame(tick);
    };
    lastRef.current = performance.now();
    rafRef.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(rafRef.current);
  }, [playing, totalDur]);

  const currentStage = useMemo(() => {
    for (let i = STAGES.length - 1; i >= 0; i--) {
      if (elapsed >= starts[i]) return i;
    }
    return 0;
  }, [elapsed, starts]);

  const reset = () => { setElapsed(0); setPlaying(true); lastRef.current = performance.now(); };
  const complete = elapsed >= totalDur;

  // Build the stream of terminal lines that should be visible by now
  const termLines = useMemo(() => {
    const out = [];
    for (let i = 0; i < STAGES.length; i++) {
      const s = STAGES[i];
      const stageStart = starts[i];
      for (const L of s.lines) {
        const lineAt = stageStart + L.t * s.dur;
        if (elapsed >= lineAt) {
          const stamp = fmtStamp(lineAt);
          out.push({ ...L, stamp });
        }
      }
    }
    return out;
  }, [elapsed, starts]);

  const termRef = useRef(null);
  useEffect(() => {
    if (termRef.current) termRef.current.scrollTop = termRef.current.scrollHeight;
  }, [termLines.length]);

  return (
    <div>
      <SectionHeader kicker="11 · pipeline" label="Run"
        right={<div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <span className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>
            {fmtStamp(elapsed)} / {fmtStamp(totalDur)}
          </span>
          <Btn small onClick={() => setPlaying(p => !p)}>{playing ? "Pause" : "Resume"}</Btn>
          <Btn small onClick={reset}>Restart</Btn>
          <Btn primary small>Open results →</Btn>
        </div>} />

      {/* Pipeline diagram — horizontal flow */}
      <Card title="Pipeline" subtitle={complete ? "run complete" : `stage ${currentStage} · ${STAGES[currentStage].name.toLowerCase()}`}
        actions={<span className="mono" style={{ fontSize: 10.5, color: complete ? "var(--ink)" : "var(--crimson)" }}>
          {complete ? "● idle" : "● running"}
        </span>}
      >
        <div style={{ padding: "8px 4px 12px" }}>
          <PipelineFlow stages={STAGES} elapsed={elapsed} starts={starts} />
        </div>
      </Card>

      <div style={{ display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 14, marginTop: 14 }}>
        <Card title="Stages" subtitle="five-stage SPARC pipeline">
          {STAGES.map((s, i) => {
            const stageStart = starts[i];
            const stageEnd   = stageStart + s.dur;
            const status = elapsed >= stageEnd ? "done" :
                           elapsed >= stageStart ? "running" : "queued";
            const progress = status === "done" ? 1 :
                             status === "running" ? (elapsed - stageStart) / s.dur : 0;
            const timeLabel = status === "queued" ? "—" :
                              status === "running" ? fmtStamp(elapsed - stageStart) :
                              fmtStamp(s.dur);
            return (
              <div key={s.n} style={{
                display: "grid", gridTemplateColumns: "30px 1fr 68px 70px",
                alignItems: "center", gap: 10, padding: "10px 0",
                borderTop: i > 0 ? "1px dashed var(--line)" : "none",
              }}>
                <span className="mono" style={{
                  display: "inline-flex", alignItems: "center", justifyContent: "center",
                  width: 26, height: 26, borderRadius: 4,
                  background: status === "done" ? "var(--ink)" :
                              status === "running" ? "var(--crimson)" : "rgba(0,0,0,0.05)",
                  color: status === "queued" ? "var(--muted)" : "#fff",
                  fontSize: 11, fontWeight: 700,
                  boxShadow: status === "running" ? "0 0 0 4px rgba(181,42,42,0.18)" : "none",
                  transition: "background 0.3s, box-shadow 0.3s",
                }}>{s.n}</span>
                <div>
                  <div style={{ fontSize: 12.5, fontWeight: 600 }}>{s.name}</div>
                  <div style={{ height: 4, background: "rgba(0,0,0,0.05)", borderRadius: 2, marginTop: 5, overflow: "hidden" }}>
                    <div style={{
                      width: `${progress * 100}%`, height: "100%",
                      background: status === "done" ? "var(--ink)" : "var(--crimson)",
                      transition: "width 0.1s linear",
                    }}/>
                  </div>
                </div>
                <Tag color={status === "done" ? "var(--ink)" : status === "running" ? "var(--crimson)" : "var(--muted)"}>
                  {status}
                </Tag>
                <span className="mono" style={{ fontSize: 10.5, textAlign: "right", color: "var(--muted)" }}>{timeLabel}</span>
              </div>
            );
          })}
        </Card>

        <Card title="Live terminal"
          subtitle={complete ? "run complete · exit 0" : `stage ${currentStage} · ${STAGES[currentStage].name.toLowerCase()}`}
          padding={0}
          style={{ minHeight: 360 }}>
          <div ref={termRef} style={{
            background: "#1a1416", color: "#e6ddcb", fontFamily: "JetBrains Mono, monospace",
            fontSize: 10.5, lineHeight: 1.6, padding: "12px 14px",
            height: 360, overflowY: "auto",
            borderRadius: "0 0 8px 8px",
          }}>
            {termLines.map((L, i) => (
              <TermLine key={i} t={termColor(L.c)}>{L.s}</TermLine>
            ))}
            {!complete && (
              <TermLine t="var(--crimson)">
                [stage {currentStage}] <Blink/>
              </TermLine>
            )}
            {complete && (
              <TermLine t="var(--gold)">[run] ✓ complete in {fmtStamp(totalDur)} · press Restart to replay</TermLine>
            )}
          </div>
        </Card>
      </div>

      {/* Summary strip appears when run completes */}
      {complete && (
        <div style={{ marginTop: 14, display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10 }}>
          <Stat label="Final R²" value="0.915" sub="+0.012 vs. std" tint="var(--crimson)" />
          <Stat label="RMSE" value="0.500" sub="z-score units" tint="var(--ink)" />
          <Stat label="Total time" value={fmtStamp(totalDur)} sub="5 stages" tint="var(--purple)" />
          <Stat label="Artefacts" value="14" sub="written to ./runs/" tint="var(--amber)" />
        </div>
      )}
    </div>
  );
}

function PipelineFlow({ stages, elapsed, starts }) {
  // Horizontal node-edge diagram that "lights up" as the run progresses.
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 0, width: "100%" }}>
      {stages.map((s, i) => {
        const stageStart = starts[i];
        const stageEnd   = stageStart + s.dur;
        const status = elapsed >= stageEnd ? "done" :
                       elapsed >= stageStart ? "running" : "queued";
        const progress = status === "done" ? 1 :
                         status === "running" ? (elapsed - stageStart) / s.dur : 0;
        const bg = status === "done" ? "var(--ink)" :
                   status === "running" ? "#fff" : "#fff";
        const border = status === "queued" ? "var(--line)" : status === "running" ? "var(--crimson)" : "var(--ink)";
        const color = status === "done" ? "#fff" : status === "queued" ? "var(--muted)" : "var(--ink)";
        return (
          <React.Fragment key={s.n}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", minWidth: 0, flex: "0 0 auto" }}>
              <div style={{
                width: 44, height: 44, borderRadius: 8,
                border: "1.5px solid " + border,
                background: bg,
                color, display: "flex", alignItems: "center", justifyContent: "center",
                fontWeight: 700, fontSize: 14, fontFamily: "JetBrains Mono, monospace",
                position: "relative",
                boxShadow: status === "running" ? "0 0 0 6px rgba(181,42,42,0.14)" : "none",
                transition: "background 0.3s, box-shadow 0.3s, border-color 0.3s",
              }}>
                {status === "done" ? "✓" : s.n}
                {status === "running" && (
                  <div style={{
                    position: "absolute", inset: -1, borderRadius: 8, pointerEvents: "none",
                    background: `conic-gradient(var(--crimson) ${progress * 360}deg, transparent 0)`,
                    WebkitMask: "radial-gradient(circle, transparent 62%, black 63%)",
                          mask: "radial-gradient(circle, transparent 62%, black 63%)",
                  }}/>
                )}
              </div>
              <div style={{ fontSize: 10.5, fontWeight: 600, marginTop: 8, textAlign: "center", maxWidth: 110, lineHeight: 1.25 }}>
                {s.name}
              </div>
              <div className="mono" style={{ fontSize: 9.5, color: "var(--muted)", marginTop: 2 }}>
                {status === "running" ? `${Math.round(progress * 100)}%` :
                 status === "done" ? fmtStamp(s.dur) : `~${fmtStamp(s.dur)}`}
              </div>
            </div>
            {i < stages.length - 1 && (
              <div style={{ flex: 1, height: 2, background: "var(--line)", position: "relative", margin: "0 4px", marginBottom: 36 }}>
                <div style={{
                  position: "absolute", inset: 0,
                  background: status === "done" ? "var(--ink)" : "transparent",
                  width: status === "done" ? "100%" : status === "running" ? `${progress * 100}%` : "0%",
                  backgroundImage: status === "running" ?
                    "linear-gradient(90deg, var(--crimson), var(--crimson))" : undefined,
                  transition: "width 0.1s linear",
                }}/>
                {status === "running" && (
                  <div style={{
                    position: "absolute", top: -2, left: `${progress * 100}%`,
                    width: 6, height: 6, borderRadius: 3, background: "var(--crimson)",
                    boxShadow: "0 0 0 3px rgba(181,42,42,0.25)",
                    transform: "translateX(-50%)",
                  }}/>
                )}
              </div>
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function fmtStamp(sec) {
  const s = Math.max(0, Math.floor(sec));
  const m = Math.floor(s / 60);
  const ss = s % 60;
  return `${String(m).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
}
function termColor(c) {
  if (c === "mute") return "var(--muted)";
  if (c === "gold") return "var(--gold)";
  if (c === "amber") return "var(--amber)";
  if (c === "crimson") return "var(--crimson)";
  return "#e6ddcb";
}
function TermLine({ t = "#e6ddcb", children }) {
  return <div style={{ color: t }}>{children}</div>;
}
function Blink() {
  return <span style={{ display: "inline-block", width: 7, height: 12, background: "currentColor", verticalAlign: "middle", marginLeft: 2, animation: "blink 1s steps(1) infinite" }}/>;
}

function Sparkline({ shape }) {
  // Build a little histogram based on shape hint
  const N = 16;
  const bars = Array.from({length: N}, (_, i) => {
    const x = i / (N - 1);
    let h;
    if (shape === "bell") h = Math.exp(-((x - 0.5) ** 2) / 0.05);
    else if (shape === "right") h = Math.exp(-x * 2.4) + 0.05;
    else if (shape === "left") h = Math.exp(-(1 - x) * 2.4) + 0.05;
    else h = 0.5;
    return h;
  });
  const max = Math.max(...bars);
  return (
    <div style={{ display: "flex", gap: 1.5, alignItems: "flex-end", height: 22, width: 90 }}>
      {bars.map((h, i) => (
        <div key={i} style={{
          flex: 1, height: `${(h / max) * 100}%`,
          background: "var(--ink)", opacity: 0.7, borderRadius: "1px 1px 0 0",
        }}/>
      ))}
    </div>
  );
}

function ResponseCurvePhysics() {
  const canvas = useRef(null);
  useEffect(() => {
    const c = canvas.current; if (!c) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = 200;
    c.width = W * DPR; c.height = H * DPR;
    const ctx = c.getContext("2d"); ctx.scale(DPR, DPR);

    const pad = { l: 36, r: 14, t: 12, b: 28 };
    // Axes
    ctx.strokeStyle = "#c9c2b3"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, H - pad.b); ctx.lineTo(W - pad.r, H - pad.b); ctx.stroke();

    // Prior band (light)
    const xToPx = (x) => pad.l + (x / 80) * (W - pad.l - pad.r);
    const yToPx = (y) => pad.t + (1 - (y + 2.0) / 2.0) * (H - pad.t - pad.b);

    // Shaded uncertainty
    ctx.fillStyle = "rgba(181,42,42,0.12)";
    ctx.beginPath();
    for (let x = 0; x <= 80; x++) {
      const y = -0.022 * x * (1 - Math.exp(-x / 30)) - 0.12;
      ctx.lineTo(xToPx(x), yToPx(y));
    }
    for (let x = 80; x >= 0; x--) {
      const y = -0.022 * x * (1 - Math.exp(-x / 30)) + 0.12;
      ctx.lineTo(xToPx(x), yToPx(y));
    }
    ctx.closePath(); ctx.fill();

    // Main response curve
    ctx.strokeStyle = "#b52a2a"; ctx.lineWidth = 2; ctx.beginPath();
    for (let x = 0; x <= 80; x++) {
      const y = -0.022 * x * (1 - Math.exp(-x / 30));
      const px = xToPx(x), py = yToPx(y);
      if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Axis ticks
    ctx.fillStyle = "#8a8478"; ctx.font = "9.5px JetBrains Mono, monospace";
    [0, 20, 40, 60, 80].forEach(x => { ctx.fillText(`${x}`, xToPx(x) - 6, H - pad.b + 13); });
    [-1.5, -1.0, -0.5, 0].forEach(y => { ctx.fillText(`${y.toFixed(1)}`, 4, yToPx(y) + 3); });
    ctx.fillText("Pct_Canopy", (W / 2) - 24, H - 3);
    ctx.save(); ctx.translate(10, H / 2 - 10); ctx.rotate(-Math.PI / 2); ctx.fillText("ΔAAT_z", 0, 0); ctx.restore();
  }, []);
  return <canvas ref={canvas} style={{ width: "100%", height: 200, display: "block" }}/>;
}

function CRSReprojectPreview() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = 240;
    c.width = W * DPR; c.height = H * DPR;
    const ctx = c.getContext("2d"); ctx.scale(DPR, DPR);

    // Two side-by-side panels: geographic (distorted), projected (true shape)
    const half = W / 2;
    ctx.fillStyle = "#fdfbf7"; ctx.fillRect(0, 0, W, H);

    function drawFrame(x0, label, sub) {
      ctx.strokeStyle = "#c9c2b3"; ctx.strokeRect(x0 + 10, 10, half - 20, H - 30);
      ctx.fillStyle = "#8a8478"; ctx.font = "10px JetBrains Mono, monospace";
      ctx.fillText(label, x0 + 14, 24);
      ctx.fillText(sub, x0 + 14, H - 8);
    }
    drawFrame(0, "EPSG:4326 · source", "graticule 0.01°");
    drawFrame(half, "EPSG:3438 · target", "grid 1 km");

    // Graticule (left)
    ctx.strokeStyle = "#d8d4cb"; ctx.lineWidth = 0.6;
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(10 + (half - 20) * i / 6, 10); ctx.lineTo(10 + (half - 20) * i / 6, H - 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(10, 10 + (H - 30) * i / 6); ctx.lineTo(half - 10, 10 + (H - 30) * i / 6); ctx.stroke();
    }
    // Grid (right)
    for (let i = 1; i < 6; i++) {
      ctx.beginPath(); ctx.moveTo(half + 10 + (half - 20) * i / 6, 10); ctx.lineTo(half + 10 + (half - 20) * i / 6, H - 20); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(half + 10, 10 + (H - 30) * i / 6); ctx.lineTo(W - 10, 10 + (H - 30) * i / 6); ctx.stroke();
    }

    // Point cloud (Providence silhouette-ish)
    ctx.fillStyle = "rgba(181,42,42,0.55)";
    for (let k = 0; k < 380; k++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * 70;
      const u = half / 2 + Math.cos(a) * r * 0.8 + (Math.random() - 0.5) * 30;
      const v = H / 2 + Math.sin(a) * r * 0.5 + (Math.random() - 0.5) * 22;
      ctx.beginPath(); ctx.arc(u, v, 1.2, 0, Math.PI * 2); ctx.fill();
      // Mirror right with subtle rotation (projected feels rotated in RI SP)
      const ur = Math.cos(0.1) * (u - half / 2) - Math.sin(0.1) * (v - H / 2) + half + half / 2;
      const vr = Math.sin(0.1) * (u - half / 2) + Math.cos(0.1) * (v - H / 2) + H / 2;
      ctx.beginPath(); ctx.arc(ur, vr, 1.2, 0, Math.PI * 2); ctx.fill();
    }

    // Arrow between
    ctx.strokeStyle = "#1a1416"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(half - 4, H / 2); ctx.lineTo(half + 4, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(half + 4, H / 2); ctx.lineTo(half - 1, H / 2 - 4); ctx.lineTo(half - 1, H / 2 + 4); ctx.closePath(); ctx.fillStyle = "#1a1416"; ctx.fill();
  }, []);
  return <canvas ref={ref} style={{ width: "100%", height: 240, display: "block" }}/>;
}

function PosteriorHist() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = 160;
    c.width = W * DPR; c.height = H * DPR;
    const ctx = c.getContext("2d"); ctx.scale(DPR, DPR);

    const pad = { l: 28, r: 10, t: 8, b: 20 };
    const N = 40;
    // Gaussian-ish histogram centred at -0.21
    const bars = Array.from({length: N}, (_, i) => {
      const x = -0.7 + (i / (N - 1)) * 0.9;
      return Math.exp(-((x + 0.21) ** 2) / 0.018) + Math.random() * 0.04;
    });
    const max = Math.max(...bars);
    const bw = (W - pad.l - pad.r) / N;
    bars.forEach((h, i) => {
      const px = pad.l + i * bw;
      const hh = (h / max) * (H - pad.t - pad.b);
      const x = -0.7 + (i / (N - 1)) * 0.9;
      const inCI = x >= -0.31 && x <= -0.12;
      ctx.fillStyle = inCI ? "#b52a2a" : "#c9c2b3";
      ctx.fillRect(px, H - pad.b - hh, bw - 1, hh);
    });
    // Axis
    ctx.strokeStyle = "#c9c2b3"; ctx.beginPath();
    ctx.moveTo(pad.l, H - pad.b); ctx.lineTo(W - pad.r, H - pad.b); ctx.stroke();
    ctx.fillStyle = "#8a8478"; ctx.font = "9.5px JetBrains Mono, monospace";
    [-0.6, -0.4, -0.2, 0].forEach(x => {
      const px = pad.l + ((x + 0.7) / 0.9) * (W - pad.l - pad.r);
      ctx.fillText(x.toFixed(1), px - 9, H - 6);
    });
    // mean line
    const mx = pad.l + ((-0.212 + 0.7) / 0.9) * (W - pad.l - pad.r);
    ctx.strokeStyle = "#1a1416"; ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(mx, pad.t); ctx.lineTo(mx, H - pad.b); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#1a1416"; ctx.fillText("μ=-0.212", mx + 3, pad.t + 10);
  }, []);
  return <canvas ref={ref} style={{ width: "100%", height: 160, display: "block" }}/>;
}

function ResidualPlot() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const W = c.clientWidth, H = 160;
    c.width = W * DPR; c.height = H * DPR;
    const ctx = c.getContext("2d"); ctx.scale(DPR, DPR);
    const pad = { l: 28, r: 10, t: 8, b: 22 };

    // Axes
    ctx.strokeStyle = "#c9c2b3"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, H - pad.b); ctx.lineTo(W - pad.r, H - pad.b); ctx.stroke();

    // zero line
    ctx.strokeStyle = "#c9c2b3"; ctx.setLineDash([3, 3]);
    const y0 = pad.t + (H - pad.t - pad.b) * 0.5;
    ctx.beginPath(); ctx.moveTo(pad.l, y0); ctx.lineTo(W - pad.r, y0); ctx.stroke();
    ctx.setLineDash([]);

    // Points
    ctx.fillStyle = "rgba(26,20,22,0.45)";
    for (let i = 0; i < 380; i++) {
      const x = Math.random() * (W - pad.l - pad.r) + pad.l;
      const g = (Math.random() + Math.random() + Math.random()) / 3 - 0.5;
      const y = y0 + g * 60;
      ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#8a8478"; ctx.font = "9.5px JetBrains Mono, monospace";
    ctx.fillText("fitted AAT_z", W / 2 - 28, H - 6);
    ctx.save(); ctx.translate(10, H / 2 + 18); ctx.rotate(-Math.PI / 2); ctx.fillText("residual", 0, 0); ctx.restore();
  }, []);
  return <canvas ref={ref} style={{ width: "100%", height: 160, display: "block" }}/>;
}

const TWEAKS = /*EDITMODE-BEGIN*/{

}/*EDITMODE-END*/;

function Splash({ onReady }) {

    const t = setTimeout(onReady, 1400);
    return () => clearTimeout(t);
  }, []);
  return (
    <div style={{
      width: "100%", height: "100%",
      display: "flex", alignItems: "center", justifyContent: "center",
      flexDirection: "column", gap: 22,
    }}>
      <div style={{ width: 180, height: 180 }}>
        <CubeLogo size={180} density={1.4} hue="ink" />
      </div>
      <div style={{ textAlign: "center" }}>
        <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: "-0.02em" }}>SPARC LABS</div>
        <div className="mono" style={{ fontSize: 10, letterSpacing: "0.2em", color: "var(--muted)", marginTop: 4 }}>
          SPATIAL ANALYSIS & RESEARCH CORE · v0.4.2
        </div>
      </div>
      <div style={{ width: 220, height: 3, background: "rgba(0,0,0,0.08)", borderRadius: 2, overflow: "hidden" }}>
        <div style={{ width: "100%", height: "100%", background: "var(--crimson)", animation: "loadBar 1.3s ease-out" }}/>
      </div>
      <style>{`
        @keyframes loadBar { from { transform: translateX(-100%); } to { transform: translateX(0); } }
        @keyframes blink { 50% { opacity: 0; } }
      `}</style>
    </div>
  );
}

function ChatPanel({ onClose }) {
  const [msgs, setMsgs] = React.useState([
    { role: "assistant", text: "I can wire up your DAG from natural language. Try: 'Canopy and impervious affect air temperature, mediated by NDVI.'" },
  ]);
  const [input, setInput] = React.useState("");
  const send = () => {
    if (!input.trim()) return;
    const u = { role: "user", text: input };
    const replies = [
      "Proposing DAG edges: Canopy→AAT, Impervious→AAT, Canopy→NDVI→AAT. Open DAG view to accept.",
      "Added monotone constraint: Pct_Canopy (−) on AAT_z. Verified against Providence UHI priors.",
      "Scenario written: canopy +10 pp · predicted mean ΔAAT_z = −0.258 (σ = 0.154).",
    ];
    setMsgs(m => [...m, u, { role: "assistant", text: replies[m.length % replies.length] }]);
    setInput("");
  };
  return (
    <div style={{
      position: "absolute", left: 244, bottom: 0, width: 360,
      height: "min(420px, calc(100% - 48px))",
      maxHeight: "calc(100% - 48px)",
      background: "#fff", border: "1px solid var(--line)", borderRadius: "8px 8px 0 0",
      display: "flex", flexDirection: "column", zIndex: 40,
      boxShadow: "0 -8px 24px rgba(0,0,0,0.08)",
      animation: "slideUp 0.22s ease-out",
    }}>
      <style>{`@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }`}</style>
      <div style={{ padding: "10px 14px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center" }}>
        <div style={{ width: 28, height: 28, marginRight: 10 }}>
          <CubeLogo size={28} density={0.5} />
        </div>
        <div>
          <div style={{ fontSize: 12, fontWeight: 700 }}>SPARC Assistant</div>
          <div className="mono" style={{ fontSize: 9.5, color: "var(--muted)" }}>claude-haiku-4.5 · dag mode</div>
        </div>
        <button onClick={onClose} style={{ marginLeft: "auto", border: "none", background: "transparent", fontSize: 16, cursor: "pointer", color: "var(--muted)" }}>×</button>
      </div>
      <div className="scroll" style={{ flex: 1, overflowY: "auto", padding: 12, display: "flex", flexDirection: "column", gap: 8 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{
            alignSelf: m.role === "user" ? "flex-end" : "flex-start",
            maxWidth: "85%",
            background: m.role === "user" ? "var(--ink)" : "#f7f4ee",
            color: m.role === "user" ? "#fff" : "var(--ink-2)",
            padding: "7px 10px", borderRadius: 7,
            fontSize: 12, lineHeight: 1.45,
          }}>{m.text}</div>
        ))}
      </div>
      <div style={{ padding: 10, borderTop: "1px solid var(--line)", display: "flex", gap: 6 }}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send()}
          placeholder="Ask about your DAG, physics, or scenarios…"
          style={{ flex: 1, padding: "7px 10px", border: "1px solid var(--line)", borderRadius: 5, fontSize: 12, fontFamily: "inherit" }}/>
        <button onClick={send} style={{ background: "var(--ink)", color: "#fff", border: "none", padding: "0 12px", borderRadius: 5, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>Send</button>
      </div>
    </div>
  );
}

function TweaksPanel({ tweaks, setTweaks, onClose }) {
  const set = (k, v) => setTweaks(t => ({ ...t, [k]: v }));
  return (
    <div style={{
      position: "fixed", right: 20, bottom: 20, width: 260,
      background: "#fff", border: "1px solid var(--ink)", borderRadius: 8,
      zIndex: 60, boxShadow: "0 12px 32px rgba(0,0,0,0.18)",
      fontFamily: "inherit",
    }}>
      <div style={{ padding: "10px 12px", borderBottom: "1px solid var(--line)", display: "flex", alignItems: "center", background: "var(--ink)", color: "#fff", borderRadius: "8px 8px 0 0" }}>
        <span className="mono" style={{ fontSize: 10, letterSpacing: "0.18em", fontWeight: 700 }}>TWEAKS</span>
        <button onClick={onClose} style={{ marginLeft: "auto", color: "#fff", background: "transparent", border: "none", cursor: "pointer", fontSize: 14 }}>×</button>
      </div>
      <div style={{ padding: 12, display: "flex", flexDirection: "column", gap: 12 }}>
        <TweakField label="Logo colour">
          <div style={{ display: "flex", gap: 4 }}>
            {["ink", "red", "purple", "amber"].map(h => (
              <button key={h} onClick={() => set("logoHue", h)} style={{
                flex: 1, padding: "5px 0", fontSize: 10.5, fontFamily: "inherit",
                border: "1px solid " + (tweaks.logoHue === h ? "var(--ink)" : "var(--line)"),
                background: tweaks.logoHue === h ? "var(--ink)" : "#fff",
                color: tweaks.logoHue === h ? "#fff" : "var(--ink-2)",
                borderRadius: 4, cursor: "pointer", textTransform: "uppercase", letterSpacing: "0.05em",
              }}>{h}</button>
            ))}
          </div>
        </TweakField>
        <TweakField label={`Matter density · ${tweaks.logoDensity.toFixed(2)}`}>
          <input type="range" min="0.3" max="2" step="0.05" value={tweaks.logoDensity}
            onChange={e => set("logoDensity", parseFloat(e.target.value))} style={{ width: "100%" }}/>
        </TweakField>
        <TweakField label="Paper tone">
          <div style={{ display: "flex", gap: 4 }}>
            {["warm", "cool", "white"].map(t => (
              <button key={t} onClick={() => set("paperTone", t)} style={{
                flex: 1, padding: "5px 0", fontSize: 10.5, fontFamily: "inherit",
                border: "1px solid " + (tweaks.paperTone === t ? "var(--ink)" : "var(--line)"),
                background: tweaks.paperTone === t ? "var(--ink)" : "#fff",
                color: tweaks.paperTone === t ? "#fff" : "var(--ink-2)",
                borderRadius: 4, cursor: "pointer", textTransform: "uppercase", letterSpacing: "0.05em",
              }}>{t}</button>
            ))}
          </div>
        </TweakField>
      </div>
    </div>
  );
}
function TweakField({ label, children }) {
  return (
    <div>
      <div className="mono" style={{ fontSize: 9.5, color: "var(--muted)", letterSpacing: "0.1em", textTransform: "uppercase", marginBottom: 5 }}>{label}</div>
      {children}
    </div>
  );
}

function App() {
  const [booting, setBooting] = React.useState(true);
  const [page, setPage] = React.useState("Results");
  const [chatOpen, setChatOpen] = React.useState(false);
  const [scenario, setScenario] = React.useState("canopy+10");
  const [tweaks, setTweaksState] = React.useState(TWEAKS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const setTweaks = (fn) => {
    setTweaksState(prev => {
      const next = typeof fn === "function" ? fn(prev) : fn;
      try {
        window.parent?.postMessage({ type: "__edit_mode_set_keys", edits: next }, "*");
      } catch(e) {}
      return next;
    });
  };

  // Paper tone override
  React.useEffect(() => {
    const r = document.documentElement.style;
    if (tweaks.paperTone === "cool") { r.setProperty("--paper", "#f3f4f2"); r.setProperty("--line", "#c5cac4"); }
    else if (tweaks.paperTone === "white") { r.setProperty("--paper", "#ffffff"); r.setProperty("--line", "#d8d4cb"); }
    else { r.setProperty("--paper", "#f7f4ee"); r.setProperty("--line", "#c9c2b3"); }
  }, [tweaks.paperTone]);

  // Edit mode protocol
  React.useEffect(() => {
    const onMsg = (e) => {
      if (e.data?.type === "__activate_edit_mode") setTweaksOpen(true);
      if (e.data?.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent?.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  // Override logo params by re-rendering CubeLogo with props on each page render:
  // We do this by passing through pages via a context-free approach:
  window.__LOGO_HUE = tweaks.logoHue;
  window.__LOGO_DENSITY = tweaks.logoDensity;

  const renderPage = () => {
    switch (page) {
      case "Project": return <ProjectPage />;
      case "Data": return <DataPage />;
      case "DAG": return <DAGPage />;
      case "Run": return <RunPage />;
      case "Results": return <ResultsPage scenario={scenario} setScenario={setScenario} />;
      case "Processing": return <ProcessingPage />;
      case "Variables": return <VariablesPage />;
      case "Physics": return <PhysicsPage />;
      case "CRS": return <CRSPage />;
      case "Scenarios": return <ScenariosPage />;
      case "Models": return <ModelsPage />;
      case "Report": return <ReportPage />;
      default: return null;
    }
  };

  return (
    <>
      <WindowChrome>
        {booting ? <Splash onReady={() => setBooting(false)} /> : (
          <>
            <Sidebar currentPage={page} onNavigate={setPage} onToggleChat={() => setChatOpen(o => !o)} chatOpen={chatOpen} />
            <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
              <Topbar page={page}/>
              <main className="scroll" style={{
                flex: 1, overflow: "auto", padding: "20px 22px",
                background: "var(--paper)",
                backgroundImage:
                  "linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px)",
                backgroundSize: "24px 24px",
                position: "relative",
              }}>
                {renderPage()}
              </main>
            </div>
            {chatOpen && <ChatPanel onClose={() => setChatOpen(false)}/>}
          </>
        )}
      </WindowChrome>
      {tweaksOpen && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} onClose={() => setTweaksOpen(false)} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);



</script>
