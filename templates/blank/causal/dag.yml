# =============================================================================
# Causal Directed Acyclic Graph — Blank Template
# =============================================================================
# Define the causal structure among your variables.
# Draw visually at https://www.dagitty.net/dags.html, then encode here.
#
# Referenced by: project.yml → causal.dag_file
# =============================================================================

# Nodes — list every variable in the causal system
nodes: []
  # - name: My_Predictor_A
  #   type: treatment       # treatment | mediator | confounder | outcome
  #   description: ""
  #
  # - name: My_Target
  #   type: outcome
  #   description: "Response variable"

# Directed edges — parent → child
edges: []
  # - parent: My_Predictor_A
  #   child: My_Target
  #   mechanism: "Brief causal explanation"

# Structural equations (optional)
structural_equations: {}

# -----------------------------------------------------------------------------
# SPARC v4 — User-asserted identification assumptions.
# Surfaced in the validation report alongside empirical checks
# (positivity, SUTVA / Moran's I, d-separation).
# Per-edge `sign_prior` / `confidence` / `kind` / `lag` may also be added.
# -----------------------------------------------------------------------------
assumptions:
  conditional_exchangeability: true
  positivity: true
  consistency: true
  no_interference: true
  notes: |
    Edit these flags to reflect your domain's identification claims.
