# =============================================================================
# SPARC Project Configuration — Blank Template
# =============================================================================
# Fill in every field marked "REQUIRED" to configure a new spatial regression
# analysis.  Optional sections can be deleted or left as-is for defaults.
#
# To create this file for a new project:
#   sparc init --template blank --output ./my_project
#
# Then edit and run:
#   sparc validate --project project.yml
#   sparc run --project project.yml
# =============================================================================

project:
  name: "My Spatial Analysis"          # REQUIRED — give the project a name
  description: ""                       # Optional
  domain: "custom"                      # Domain identifier (for your records)
  version: "1.0.0"
  author: ""
  response_units: ""                    # e.g. "°F", "mg/L", "µg/m³"

# ---------------------------------------------------------------------------
# Input Data  (REQUIRED)
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Data Collection (sparc collect)
# ---------------------------------------------------------------------------
collect:
  grid_resolution_m: 30        # Analysis grid cell size in metres

data:
  file_path: ""                         # REQUIRED — path to your CSV
  target_column: ""                     # REQUIRED — response variable column name
  identifier_column: ""                 # Unique row ID column (or leave blank if none)
  coord_columns: ["", ""]              # REQUIRED — [X/Easting column, Y/Northing column]
  # areas_of_interest_file: ""          # Optional — CSV mapping locations to named zones

# ---------------------------------------------------------------------------
# Coordinate Reference Systems  (REQUIRED)
# ---------------------------------------------------------------------------
crs:
  input: ""                             # REQUIRED — EPSG code of input data (e.g. "EPSG:4326")
  projected: ""                         # REQUIRED — projected CRS for spatial analysis (e.g. "EPSG:32617")

# ---------------------------------------------------------------------------
# Predictor Variables  (REQUIRED)
# ---------------------------------------------------------------------------
# List every column name from your data that should be used as a predictor.
predictors:
  - ""   # Add predictor column names here, one per line

# ---------------------------------------------------------------------------
# Physics / Domain Constraints  (optional but recommended)
# ---------------------------------------------------------------------------
physics:
  # Point these at your own YAML files (copy from templates/uhi/physics/ as a starting point)
  # priors_file: "physics/priors.yml"
  # caps_file:   "physics/caps.yml"

  # Monotone constraints: predictor_name → -1 (decreasing), +1 (increasing), 0 (none)
  monotone_constraints: {}
    # Example:
    # My_Predictor_A: -1
    # My_Predictor_B:  1

# ---------------------------------------------------------------------------
# Causal DAG  (optional — needed for counterfactual simulation)
#
# When enabled, Stage 3 runs the gold-standard Wager (2025) Bayesian
# pipeline (MC³ structure search + NUTS posterior + 10-gap audit).
# All sub-blocks (discovery / mc3 / nuts / bayesian_cate / wager2025)
# fall back to safe defaults if omitted.
# ---------------------------------------------------------------------------
# causal:
#   dag_file: "causal/dag.yml"
#   estimator: "dml"
#   estimate_cate: true
#   inference: "bayesian"
#   discovery:
#     enabled: true
#     methods: [pc_stable, lingam, ges]
#     alpha: 0.05
#     consensus_threshold: 2
#   mc3:
#     n_iterations: 10000
#     n_chains: 4
#     burnin_fraction: 0.25
#   nuts:
#     n_samples: 2000
#     n_warmup: 500
#     n_chains: 2
#     target_accept_rate: 0.85
#   bayesian_cate:
#     n_features: 16
#     n_samples: 2000
#     n_warmup: 500
#     n_chains: 2
#     target_accept_rate: 0.85
#   wager2025:
#     overlap: true
#     rate_qini: true
#     spillover: true
#     iv: true
#     sequential_aipw: true
#     panel: true
#     policy_learning: true
#     cbps: true
#   actionable_variables: []
#   fixed_variables: []

# ---------------------------------------------------------------------------
# Output
# ---------------------------------------------------------------------------
output:
  base_dir: "output"
  stage_dirs:
    stage_0: "Stage_0_Correlogram"
    stage_1: "Stage_1_GWEN"
    stage_2: "Stage_2_Spatial_CV"
    stage_3: "Stage_3_Spatial_Intelligence"
    final:   "Final_Interpretation_Results"

# ---------------------------------------------------------------------------
# Pipeline Globals
# ---------------------------------------------------------------------------
pipeline:
  random_seed: 42
  n_spatial_folds: 5
  fast_mode: false
  overwrite_outputs: false
  run_mc_uncertainty: true     # Monte-Carlo uncertainty propagation in Stage 4
  n_mc_draws: 50               # Number of MC draws
  scenario_mode: "auto"        # auto | hybrid | dag_coefficient | model_reprediction
  fast_mode: false
  overwrite_outputs: false

flags:
  use_gwen_selection: true
  include_gwrf_in_ensemble: true
  use_laplacian_eigenmaps_in_ols: false

# ---------------------------------------------------------------------------
# Model Hyperparameters  (all optional — sensible defaults used if omitted)
# ---------------------------------------------------------------------------
# Uncomment and edit any section to override defaults.

# models:
#   gwr:
#     bandwidth: null
#     kernel: "gaussian"
#   gwrf:
#     n_estimators: 100
#     k_neighbors: 100
#   ggpgam:
#     n_splines: 5
#     lam: 0.6
#   meta_ensemble:
#     algorithm: "neural"
#   spatial_cv:
#     block_size: null
#     buffer_size: 300

# ---------------------------------------------------------------------------
# GWEN Variable Selection
# ---------------------------------------------------------------------------
# gwen:
#   sample_size: 5000
#   k_neighbors: 500
#   selection_threshold: 0.1
#   spatial_cv: false             # Standard k-fold is sufficient for screening
#   local_cv: false               # Reuse global alpha for local models (much faster)
#   stability_folds: 0            # 0 = disabled; set to 5 for full stability scoring

# ---------------------------------------------------------------------------
# Laplacian Eigenmaps
# ---------------------------------------------------------------------------
# laplacian:
#   n_eigenmaps: 150
#   k_for_swm: 10

# ---------------------------------------------------------------------------
# Intervention Scenarios  (optional — for counterfactual simulation)
# ---------------------------------------------------------------------------
# scenarios:
#   - name: "Example Scenario"
#     variable: My_Predictor_A
#     direction: increase
#     increments: [1, 2, 3, 4, 5]
#     min_val: 0
#     max_val: 100
#     unit: "units"

# ---------------------------------------------------------------------------
# Variable Display Metadata  (optional — controls human-readable labels)
# ---------------------------------------------------------------------------
# Used by the Stage 3/4/5 reporters and server API to render
# human-readable effect strings such as
#     "-0.28 Fahrenheit per 1% of canopy increase"
# instead of bare standardized coefficients.
#
# All keys are optional.  When absent, units fall back to
# ``output.response_units`` (target) and ``scenarios[].unit`` (treatments),
# and ``display_name`` defaults to the column name with underscores
# replaced by spaces.
#
# variables_meta:
#   AAT_z:
#     unit: "°F"                     # canonical short symbol
#     unit_full: "Fahrenheit"        # spelled-out form for prose; auto-derived
#                                    # from a small unit map when omitted
#     display_name: "ambient air temperature"
#     description: "Air temperature anomaly above the regional mean"
#   Pct_Canopy:
#     unit: "%"
#     display_name: "canopy"
#     actionable: true               # overrides causal.actionable_variables
#     direction: "increase"          # overrides scenarios[].direction
#   NDVI:
#     unit: "index"                  # rendered as "0.1 index of NDVI increase"
#     display_name: "NDVI"
#

# ---------------------------------------------------------------------------
# Spatiotemporal Configuration  (optional — for panel / time-series data)
# ---------------------------------------------------------------------------
# Enable this section when your data has repeated observations over time.
# Requires a time column in the CSV (date, timestamp, or integer period).
#
# temporal:
#   enabled: true
#   time_column: "date"               # Column with timestamps/time indices
#   frequency: "monthly"              # hourly | daily | weekly | monthly | quarterly | annual | custom
#   training_window: null             # Number of time steps for training (null = use all)
#   validation_window: null           # Time steps held out for temporal validation
#   forecast_horizon: 0              # Future steps to predict (0 = no forecasting)
#
#   lag_features:
#     enabled: true
#     lags: [1, 2, 3]                 # Create t-1, t-2, t-3 lagged predictors
#     rolling_windows: [3, 6]         # Rolling mean/std over 3 and 6 periods
#     variables: []                   # Subset of predictors to lag (empty = all)
#
#   temporal_cv:
#     method: "expanding_window"      # expanding_window | sliding_window | spatiotemporal_block
#     n_splits: 5
#     gap: 0                          # Time steps gap between train/test (leak protection)
#
#   aggregation:
#     method: "none"                  # none | mean | median | max | min | trend_slope
#     period: null                    # Aggregation period (null = all time steps)

# ---------------------------------------------------------------------------
# Pipeline Globals (additional V2 keys)
# ---------------------------------------------------------------------------

flags:
  use_gwen_selection: true
  include_gwrf_in_ensemble: true
  use_laplacian_eigenmaps_in_ols: false

# ---------------------------------------------------------------------------
# Model Hyperparameters
# ---------------------------------------------------------------------------
models:

  gwr:
    bandwidth: null          # null = auto-select via correlogram
    kernel: "gaussian"
    alpha: 0.1
    min_points: 50

  gwrf:
    n_estimators: 100
    k_neighbors: 100
    min_samples_leaf: 5
    n_jobs: 1
    subsample_fraction: null
    subsample_n: null

  ggpgam:
    n_splines: 5
    n_spatial_bases: 10
    lam: 0.6
    max_iter: 100

  meta_ensemble:
    algorithm: "neural"
    include_base_features: true
    include_laplacian_pca: true

  meta_learner: "neural"

  neural:
    hidden_dim: 256
    dropout: 0.1
    n_heads: 4
    max_neighbors: 128
    siren_omega: 30.0
    exceedance_thresholds: [0.25, 0.50, 0.75]
    geo_pe_dim: 32             # Geographic positional encoding dim (Space2Vec Fourier; 0 = disabled)

  spatial_cv:
    block_size: null           # null = auto from Stage 1 correlogram
    buffer_size: 300           # metres
    block_size_source: "correlogram"
    method: "block"
    stratify_y: true

# ---------------------------------------------------------------------------
# GWEN Variable Selection
# ---------------------------------------------------------------------------
gwen:
  sample_size: 5000
  k_neighbors: 500
  cv_folds: 5
  selection_threshold: 0.1
  l1_ratios: [0.1, 0.5, 0.7, 0.9, 0.95, 0.99]
  n_alphas: 100
  spatial_cv: false
  local_cv: false
  stability_folds: 0

# ---------------------------------------------------------------------------
# Laplacian Eigenmaps
# ---------------------------------------------------------------------------
laplacian:
  n_eigenmaps: 150
  k_for_swm: 10

# ---------------------------------------------------------------------------
# V2 Training Configuration
# ---------------------------------------------------------------------------
training:
  n_epochs: 100
  batch_size: 512
  learning_rate: 0.001
  lambda_mse: 1.0
  lambda_exceedance: 0.1
  lambda_physics: 0.01
  lambda_smooth_pred: 0.01
  lambda_smooth_alpha: 0.001
  lambda_alpha_prior: 1.0
  lambda_surrogate: 0.1
  lambda_neighbor: 0.1
  lambda_pde: 0.05             # V3 multi-term PDE loss (0 = disabled)

# ---------------------------------------------------------------------------
# V2 Optimization
# ---------------------------------------------------------------------------
optimization:
  run_cma_es: false
  clip_norm: 1.0
  swa_epochs: 20
  capacity_sweep: false

# ---------------------------------------------------------------------------
# JEPA — Self-supervised auxiliary objective on the SharedTrunk
# ---------------------------------------------------------------------------
# V-JEPA 2-style: EMA target trunk + masked-channel context + latent
# predictor with VICReg anti-collapse.  Set enable: true once you have
# validated the supervised pipeline for this domain.
#
# Phase 2 weights (lambda_scenario, lambda_latent_pde) are 0 by default —
# enable Phase 1 first, then raise these once it trains stably.
# ---------------------------------------------------------------------------
jepa:
  enable: false                # Set true to activate self-supervised pretraining
  pretrain_epochs: 20          # Phase 1 EMA-trunk pretraining epochs (0 = skip)
  mask_ratio: 0.4
  lambda: 1.0

  ema_tau_start: 0.99
  ema_tau_end:   0.9999
  ema_warmup_steps: 1000

  curriculum_start: 5
  curriculum_end:   15

  lambda_align:      1.0
  lambda_variance:   1.0
  lambda_covariance: 0.04
  variance_gamma:    1.0

  action_dim:        64
  predictor_blocks:  2
  predictor_film:    false     # Enable after Phase 1 is stable
  lambda_scenario:   0.0       # Phase 2: action-conditioned distillation (0 = off)
  lambda_latent_pde: 0.0       # Phase 2: latent Laplacian smoothness (0 = off)
  scenario_perturb_std: 0.5

# ---------------------------------------------------------------------------
# V2 Process Rate Network  (domain-specific — uncomment and customise)
# ---------------------------------------------------------------------------
# process_rate:
#   enabled: false
#   name: "domain_process_rate"   # e.g. "fire_spread_rate", "runoff_coefficient"
#   units: "domain units"
#   bounds: [0.0, 1.0]
#   prior_mean: 0.5
#   inputs: []                    # predictor columns that drive the process rate

# ---------------------------------------------------------------------------
# Hardware Performance Override  (optional)
# ---------------------------------------------------------------------------
# performance:
#   hardware_tier_override: null  # null = auto-detect; "standard" | "high"
#   preset: null                  # null = auto; "balanced" | "max"
#   cuda_graphs: false
#   force_cpu: false

# ---------------------------------------------------------------------------
# V3 Transfer / Continual Learning Registry  (optional)
# ---------------------------------------------------------------------------
# registry:
#   path: "sparc_registry"
#   city_name: ""               # Unique identifier for this study area
#   use_global_trunk: false
#   ewc_lambda: 0.0
#   replay_lambda: 0.0
#   coreset_size: 400
