project:
  name: ForceSMIP-SPARC-Pooled-psl-v2
  description: "Cross-member pooled analysis for psl — v2 with benchmark metrics"
  domain: climate_forced_response
  version: '2.1'
  response_units: "Pa per 42yr trend"

data:
  file_path: data/forcesmip_psl_pooled.csv
  target_column: psl_trend
  identifier_column: row_id
  coord_columns:
    - lon
    - lat
  areas_of_interest_file: data/global_2p5deg_grid.gpkg

crs:
  input: EPSG:4326
  projected: EPSG:6933

predictors:
  - GMST_trend
  - AMV_index
  - IPO_index
  - lat_abs
  - land_fraction
  - ocean_basin
  - member_id

physics:
  priors_file: physics/forcesmip_priors_psl.yml
  caps_file: physics/forcesmip_caps.yml

causal:
  dag_file: causal/forcesmip_dag_pooled_v2_psl.yml
  estimator: dml
  dml_shrinkage: 0.3
  dml_cv_folds: 5
  dag_blend_weight: 0.7
  estimate_cate: true
  ipw_enabled: true
  doubly_robust: true
  dose_response: true
  bootstrap_n: 200
  actionable_variables:
    - GMST_trend
    - AMV_index
    - IPO_index
  fixed_variables:
    - lat_abs
    - land_fraction
    - ocean_basin
    - member_id

scenarios:
  - name: warming_1C
    variable: GMST_trend
    direction: increase
    increments: [0.5, 1.0, 1.5]
    unit: "°C global mean"
  - name: AMV_positive
    variable: AMV_index
    direction: increase
    increments: [0.02, 0.05]
    unit: "index units"
  - name: IPO_positive
    variable: IPO_index
    direction: increase
    increments: [0.03, 0.06]
    unit: "index units"

output:
  base_dir: output/forcesmip_psl_pooled_v2

models:
  gwr:
    bandwidth: 2000000
    kernel: gaussian
    min_points: 50
  gwrf:
    n_estimators: 100
    k_neighbors: 200
    min_samples_leaf: 5
  ggpgam:
    n_splines: 5
    n_spatial_bases: 10
    lam: 0.6
  meta_ensemble:
    algorithm: lightgbm
    n_optuna_trials: 25
  spatial_cv:
    block_size: 3000000
    buffer_size: 500000
    method: block

pipeline:
  random_seed: 42
  n_spatial_folds: 5
  fast_mode: false
  overwrite_outputs: false

benchmark_metrics:
  enabled: true
  area_weighted: true

fingerprint:
  enabled: false
