# =============================================================================
# ForceSMIP Causal DAG — Cross-Member Pooled Analysis (v2) — PR
# =============================================================================

nodes:
  - name: GMST_trend
    type: treatment
    description: "Global mean surface temperature trend — varies across members"

  - name: AMV_index
    type: treatment
    description: "Atlantic Multidecadal Variability index"

  - name: IPO_index
    type: treatment
    description: "Interdecadal Pacific Oscillation index"

  - name: member_id
    type: confounder
    description: "Climate model identity — captures model-specific biases"

  - name: lat_abs
    type: confounder
    description: "Absolute latitude — spatial structure"

  - name: land_fraction
    type: confounder
    description: "Land coverage fraction"

  - name: ocean_basin
    type: confounder
    description: "Ocean basin classification"

  - name: pr_trend
    type: outcome
    description: "Local precipitation trend — forced component to isolate"

edges:
  - parent: GMST_trend
    child: pr_trend
    mechanism: "thermodynamic precipitation scaling with warming"

  - parent: AMV_index
    child: pr_trend
    mechanism: "Atlantic multidecadal influence on precipitation"

  - parent: IPO_index
    child: pr_trend
    mechanism: "Pacific decadal influence on precipitation"

  - parent: AMV_index
    child: GMST_trend
    mechanism: "AMV contribution to global mean temperature"

  - parent: IPO_index
    child: GMST_trend
    mechanism: "IPO contribution to global mean temperature"

temporal_edges:
  - source: GMST_trend
    target: pr_trend
    lag: 1
    description: "Global warming signal propagates to precipitation field"
