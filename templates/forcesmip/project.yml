# =============================================================================
# ForceSMIP-SPARC: Forced Response Estimation via Causal Spatial Regression
# =============================================================================
# Template for processing ForceSMIP Tier 1 data through the SPARC pipeline.
# Uses the fingerprinting approach: cross-sectional trend fields per variable.
#
# Run preprocess_forcesmip.py first to convert NetCDF → CSV.
# Then run one pipeline instance per target variable × evaluation member.
#
# Citation:
#   Wills, R.C.J., et al. (2025): Forced Component Estimation Statistical
#   Method Intercomparison Project (ForceSMIP), ESS Open Archive,
#   https://doi.org/10.22541/essoar.175003371.14843115/v1
# =============================================================================

project:
  name: "ForceSMIP-SPARC"
  description: "Causal forced response estimation from climate model ensemble members"
  domain: "climate_forced_response"
  version: "1.0"
  author: "Your Name"
  response_units: "°C per 42yr trend"

data:
  # Swap target_column and file_path per run (see run_batch.py)
  file_path: "data/forcesmip_tos_1A.csv"
  target_column: "tos_trend"
  identifier_column: "grid_cell_id"
  coord_columns: ["lon", "lat"]
  areas_of_interest_file: "data/global_2p5deg_grid.gpkg"

crs:
  input: "EPSG:4326"
  projected: "EPSG:6933"      # WGS 84 / NSIDC EASE-Grid 2.0 Global (equal-area, meters)

predictors:
  # Forcing timeseries regressors (fingerprinting / MLR-Forcing approach)
  - "GMST_trend"               # Global mean surface temperature trend
  - "GHG_forcing_index"        # Greenhouse gas forcing timeseries
  - "aerosol_forcing_index"    # Anthropogenic aerosol forcing
  - "volcanic_forcing_index"   # Natural volcanic forcing
  - "solar_forcing_index"      # Natural solar variability forcing
  # Internal variability mode indices (confounders)
  - "ENSO_detrended"           # Detrended Nino3.4
  - "AMV_index"                # Atlantic Multidecadal Variability
  - "IPO_index"                # Interdecadal Pacific Oscillation
  # Spatial / physical covariates
  - "lat_abs"                  # Absolute latitude (polar amplification)
  - "land_fraction"            # Land vs ocean fraction
  - "ocean_basin"              # Encoded basin ID (0=land, 1=Atlantic, ...)

physics:
  # Swap priors_file per target variable (tos/tas/pr/psl have different physics)
  priors_file: "physics/forcesmip_priors_tos.yml"
  caps_file: "physics/forcesmip_caps.yml"
  monotone_constraints:
    GHG_forcing_index: 1       # GHG forcing always warms
    aerosol_forcing_index: -1  # Aerosol forcing always cools
    volcanic_forcing_index: 0  # Can go either way regionally
    solar_forcing_index: 0
    ENSO_detrended: 0
    AMV_index: 0
    IPO_index: 0
    lat_abs: 0
    land_fraction: 0
    ocean_basin: 0

causal:
  dag_file: "causal/dag.yml"
  estimator: "dml"              # "dml" (Wager 2025 default), "hgb", or "ols"
  estimate_cate: true           # Spatial CATE via Bayesian low-rank GP
  inference: "bayesian"         # "bayesian" (V2 default: MC³ + NUTS) or "frequentist" (V1, deprecated)
  cate_estimator: "bayesian"
  discovery:
    enabled: true
    methods: [pc_stable, lingam, ges]
    alpha: 0.05
    consensus_threshold: 2
    compare_expert: true
  mc3:
    n_iterations: 10000
    n_chains: 4
    burnin_fraction: 0.25
    edge_penalty: 1.0
    seed: 42
  nuts:
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
  bayesian_cate:
    n_features: 16              # low-RAM laptops: 16; servers: 32+
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
    kernel_lengthscale: 0.20
  wager2025:
    overlap: true               # Gap 1
    rate_qini: true             # Gap 2
    spillover: true             # Gap 3
    iv: true                    # Gaps 4-5 (only fires if DAG has instrument)
    sequential_aipw: true       # Gap 6
    panel: true                 # Gap 7 (only fires with panel cols)
    policy_learning: true       # Gap 8
    cbps: true                  # Gap 9
  actionable_variables:
    - "GHG_forcing_index"
    - "aerosol_forcing_index"
  fixed_variables:
    - "lat_abs"
    - "land_fraction"
    - "ocean_basin"

output:
  base_dir: "output/forcesmip_tos"
  stage_dirs:
    stage_1: "01_correlogram"
    stage_2: "02_spatial_cv"
    stage_3: "03_causal"
    stage_4: "04_scenarios"
    final: "final"

pipeline:
  random_seed: 42
  n_spatial_folds: 5
  fast_mode: false
  overwrite_outputs: false
  run_mc_uncertainty: false
  n_mc_draws: 500
  skip_pdp: true

flags:
  use_gwen_selection: true
  include_gwrf_in_ensemble: true
  use_laplacian_eigenmaps_in_ols: true

models:
  gwr:
    bandwidth: null            # Auto-select via k-NN
    kernel: "gaussian"
    min_points: 50
  gwrf:
    n_estimators: 100
    k_neighbors: 100
    min_samples_leaf: 5
  ggpgam:
    n_splines: 5
    n_spatial_bases: 10
    lam: 0.6
  meta_ensemble:
    algorithm: "neural"
    n_optuna_trials: 25
  spatial_cv:
    block_size: null           # Auto-detect from correlogram (EPSG:6933 meters)
    buffer_size: 500000        # 500 km buffer in meters
    method: "block"

gwen:
  sample_size: null            # Use all data (~10,000 grid cells)
  k_neighbors: 200
  cv_folds: 5
  selection_threshold: 0.1
  spatial_cv: false             # Standard k-fold is sufficient for screening
  local_cv: false               # Reuse global alpha for local models (much faster)
  stability_folds: 0            # 0 = disabled; set to 5 for full stability scoring

laplacian:
  n_eigenmaps: 50              # Fewer than UHI; global patterns are smoother
  k_for_swm: 20               # More neighbors for sparser global grid

scenarios:
  - name: "2xCO2_forcing"
    variable: "GHG_forcing_index"
    direction: "increase"
    increments: [0.5, 1.0, 2.0]
    min_val: 0.0
    max_val: 10.0
    unit: "W/m2 equivalent"
  - name: "aerosol_reduction"
    variable: "aerosol_forcing_index"
    direction: "decrease"
    increments: [0.25, 0.5, 1.0]
    min_val: -5.0
    max_val: 0.0
    unit: "W/m2 equivalent"
  - name: "ENSO_neutral"
    variable: "ENSO_detrended"
    direction: "decrease"
    increments: [0.5, 1.0]
    min_val: -3.0
    max_val: 3.0
    unit: "°C"

# ---------------------------------------------------------------------------
# Stage-4 Budget Optimizer (cell-level allocation under a budget)
# ---------------------------------------------------------------------------
# Reads the per-cell cooling/benefit surface from Stage 4's
# ``scenario_results`` and allocates a budget across cells using
# greedy / 2-opt / MILP solvers.  Set ``total: null`` to skip the
# constrained optimum and emit only the Pareto frontier (cost vs benefit).
budget:
  total: null                  # null → unconstrained Pareto only
  solver: greedy_2opt          # greedy | greedy_2opt | milp
  multipliers: [0.25, 0.5, 0.75, 1.0, 1.5]
  cost_per_unit: {}            # e.g. {Pct_Canopy: 250}; empty = unit cost

# ---------------------------------------------------------------------------
# Stage-4 Wager-2025 caps (saturation + spillover folding)
# ---------------------------------------------------------------------------
# ``spillover_mode``:
#   diagnostic       — direct/spillover/total are side-columns only.
#   fold_into_delta  — headline ``delta_mean`` becomes the SUTVA-corrected
#                      total; ``delta_direct_only`` preserves the unit-level
#                      number for review.  Default in mode_5_full_audit.
# ``saturation_clipping``: when true, per-cell delta is capped at the
# Stage-3 dose-response knee (saturation_marginal_floor × peak |slope|).
caps:
  spillover_mode: fold_into_delta
  saturation_clipping: true
  saturation_marginal_floor: 0.5

