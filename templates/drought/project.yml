# =============================================================================
# SPARC Project Configuration — Drought Severity Domain
# =============================================================================
# Spatial analysis of drought severity (SPI/SPEI/soil moisture) driven by
# precipitation deficit, evapotranspiration, temperature, and land cover.
#
# Key references:
#   - McKee et al. (1993) — Standardized Precipitation Index (SPI)
#   - Vicente-Serrano et al. (2010) — SPEI
#   - AghaKouchak et al. (2015) — Multi-index drought framework
# =============================================================================

project:
  name: "Drought Severity Analysis"
  description: "Spatiotemporal regression of drought severity driven by precipitation, evapotranspiration, temperature, and land cover"
  domain: drought
  version: "1.0.0"
  author: ""
  response_units: "SPEI"

data:
  file_path: ""
  target_column: "SPEI"                        # Standardized Precipitation-Evapotranspiration Index
  identifier_column: "grid_id"
  coord_columns: ["longitude", "latitude"]

crs:
  input: "EPSG:4326"
  projected: ""

predictors:
  - precipitation_mm          # Monthly precipitation (mm)
  - temperature_C             # Mean monthly temperature (°C)
  - potential_ET_mm           # Potential evapotranspiration (mm)
  - soil_moisture_pct         # Root zone soil moisture (%)
  - NDVI                      # Vegetation greenness index
  - relative_humidity_pct     # Relative humidity (%)
  - wind_speed_ms             # Mean wind speed (m/s)
  - solar_radiation_Wm2       # Incoming shortwave radiation (W/m²)
  - elevation_m               # Terrain elevation (m)
  - clay_content_pct          # Soil clay content (%) — water holding capacity

physics:
  priors_file: "physics/priors.yml"
  caps_file:   "physics/caps.yml"
  monotone_constraints:
    precipitation_mm:  1           # More rain → less drought (higher SPEI)
    temperature_C: -1              # Higher temp → more ET → worse drought
    potential_ET_mm: -1            # More ET demand → worse drought
    soil_moisture_pct:  1          # Higher soil moisture → less drought
    NDVI:  1                       # Usually covariate — greener regions less drought-stressed
    relative_humidity_pct:  1      # Higher humidity → less ET → less drought
    solar_radiation_Wm2: -1        # More radiation → more ET → more drought
    clay_content_pct:  1           # Clay retains more water → buffers drought

causal:
  dag_file: "causal/dag.yml"
  estimator: "dml"              # "dml" (Wager 2025 default), "hgb", or "ols"
  estimate_cate: true           # Spatial CATE via Bayesian low-rank GP
  inference: "bayesian"         # "bayesian" (V2 default: MC³ + NUTS) or "frequentist" (V1, deprecated)
  cate_estimator: "bayesian"
  discovery:
    enabled: true
    methods: [pc_stable, lingam, ges]
    alpha: 0.05
    consensus_threshold: 2
    compare_expert: true
  mc3:
    n_iterations: 10000
    n_chains: 4
    burnin_fraction: 0.25
    edge_penalty: 1.0
    seed: 42
  nuts:
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
  bayesian_cate:
    n_features: 16              # low-RAM laptops: 16; servers: 32+
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
    kernel_lengthscale: 0.20
  wager2025:
    overlap: true               # Gap 1
    rate_qini: true             # Gap 2
    spillover: true             # Gap 3
    iv: true                    # Gaps 4-5 (only fires if DAG has instrument)
    sequential_aipw: true       # Gap 6
    panel: true                 # Gap 7 (only fires with panel cols)
    policy_learning: true       # Gap 8
    cbps: true                  # Gap 9
  fixed_variables:
    - elevation_m
    - clay_content_pct

output:
  base_dir: "output"

pipeline:
  random_seed: 42
  n_spatial_folds: 5

