# =============================================================================
# SPARC Project Configuration — Air Quality Domain
# =============================================================================
# Spatial regression of ambient PM2.5 or O3 concentration driven by
# emissions, meteorology, land use, and topography.
#
# Key references:
#   - Jerrett et al. (2005) — Land-use regression for NO2
#   - Di et al. (2019) — PM2.5 exposure modeling
#   - EPA AP-42 — Emission factor documentation
# =============================================================================

project:
  name: "Air Quality Analysis"
  description: "Spatiotemporal regression of PM2.5 concentrations driven by emissions, meteorology, and land use"
  domain: air_quality
  version: "1.0.0"
  author: ""
  response_units: "µg/m³"

data:
  file_path: ""
  target_column: "PM25_ugm3"
  identifier_column: "monitor_id"
  coord_columns: ["longitude", "latitude"]

crs:
  input: "EPSG:4326"
  projected: ""

predictors:
  - traffic_density_vkm       # Vehicle-km traveled per km² per day
  - industrial_emissions_tpy  # Nearby industrial PM2.5 emissions (tons/yr)
  - distance_to_road_m        # Distance to nearest major road (m)
  - wind_speed_ms              # Mean wind speed (m/s)
  - mixing_height_m            # Planetary boundary layer height (m)
  - temperature_C              # Ambient temperature (°C)
  - relative_humidity_pct      # Relative humidity (%)
  - NDVI                       # Vegetation greenness index
  - population_density_km2     # Population density (people/km²)
  - elevation_m                # Elevation (m)

physics:
  priors_file: "physics/priors.yml"
  caps_file:   "physics/caps.yml"
  monotone_constraints:
    traffic_density_vkm:  1       # More traffic → more PM2.5
    industrial_emissions_tpy:  1  # More emissions → more PM2.5
    distance_to_road_m: -1        # Farther from road → less PM2.5
    wind_speed_ms: -1             # More wind → better dispersion
    mixing_height_m: -1           # Higher PBL → more dilution
    NDVI: -1                      # Vegetation filters particles
    population_density_km2:  1    # More people → more activity → emissions

causal:
  dag_file: "causal/dag.yml"
  estimator: "dml"              # "dml" (Wager 2025 default), "hgb", or "ols"
  estimate_cate: true           # Spatial CATE via Bayesian low-rank GP
  inference: "bayesian"         # "bayesian" (V2 default: MC³ + NUTS) or "frequentist" (V1, deprecated)
  cate_estimator: "bayesian"
  discovery:
    enabled: true
    methods: [pc_stable, lingam, ges]
    alpha: 0.05
    consensus_threshold: 2
    compare_expert: true
  mc3:
    n_iterations: 10000
    n_chains: 4
    burnin_fraction: 0.25
    edge_penalty: 1.0
    seed: 42
  nuts:
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
  bayesian_cate:
    n_features: 16              # low-RAM laptops: 16; servers: 32+
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
    kernel_lengthscale: 0.20
  wager2025:
    overlap: true               # Gap 1
    rate_qini: true             # Gap 2
    spillover: true             # Gap 3
    iv: true                    # Gaps 4-5 (only fires if DAG has instrument)
    sequential_aipw: true       # Gap 6
    panel: true                 # Gap 7 (only fires with panel cols)
    policy_learning: true       # Gap 8
    cbps: true                  # Gap 9
  actionable_variables:
    - traffic_density_vkm
    - industrial_emissions_tpy
    - NDVI
  fixed_variables:
    - elevation_m
    - distance_to_road_m

output:
  base_dir: "output"

pipeline:
  random_seed: 42
  n_spatial_folds: 5

scenarios:
  - name: "Traffic Reduction — EV Transition"
    variable: traffic_density_vkm
    direction: decrease
    increments: [1000, 5000, 10000, 20000]
    min_val: 0
    max_val: 200000
    unit: "veh·km/km²/day"

  - name: "Industrial Emissions Control"
    variable: industrial_emissions_tpy
    direction: decrease
    increments: [10, 50, 100]
    min_val: 0
    max_val: 5000
    unit: "tons/yr"

  - name: "Urban Greening"
    variable: NDVI
    direction: increase
    increments: [0.05, 0.10, 0.15]
    min_val: -0.1
    max_val: 0.9
    unit: "index"

