# =============================================================================
# SPARC Project Configuration — Groundwater Domain
# =============================================================================
# Spatial regression of groundwater levels as a function of recharge,
# pumping, hydrogeology, and climate.  Temporal mode supports monitoring
# well time-series for trend analysis and forecasting.
#
# Key references:
#   - Darcy (1856) — Flow through porous media
#   - Theis (1935) — Transient well hydraulics
#   - Healy (2010) — Estimating Groundwater Recharge
# =============================================================================

project:
  name: "Groundwater Level Analysis"
  description: "Spatiotemporal analysis of groundwater levels driven by recharge, pumping, and aquifer properties"
  domain: groundwater
  version: "1.0.0"
  author: ""
  response_units: "m"


# ---------------------------------------------------------------------------
# Data Collection (sparc collect)
# ---------------------------------------------------------------------------
collect:
  grid_resolution_m: 30        # Analysis grid cell size in metres

data:
  file_path: ""
  target_column: "gw_level_m"                  # Depth to groundwater (m below ground surface)
  identifier_column: "well_id"
  coord_columns: ["longitude", "latitude"]

crs:
  input: "EPSG:4326"
  projected: ""

predictors:
  - precipitation_mm          # Monthly/annual precipitation (mm)
  - recharge_rate_mmyr        # Estimated recharge rate (mm/yr)
  - pumping_rate_m3d          # Nearby well pumping rate (m³/day)
  - hydraulic_conductivity_md # Aquifer K (m/day)
  - transmissivity_m2d        # Aquifer transmissivity (m²/day)
  - distance_to_river_m       # Distance to nearest stream/river (m)
  - aquifer_thickness_m       # Saturated thickness (m)
  - elevation_m               # Land surface elevation (m)
  - NDVI                      # Vegetation index (proxy for ET demand)

physics:
  priors_file: "physics/priors.yml"
  caps_file:   "physics/caps.yml"
  monotone_constraints:
    precipitation_mm:  1            # More rain → higher water table
    recharge_rate_mmyr:  1          # More recharge → higher levels
    pumping_rate_m3d: -1            # More pumping → lower levels
    hydraulic_conductivity_md:  0   # Complex: enables flow in and out
    distance_to_river_m: -1         # Farther from river → less recharge
    NDVI: -1                        # More vegetation → more ET → lower levels

causal:
  dag_file: "causal/dag.yml"
  estimator: "dml"              # "dml" (Wager 2025 default), "hgb", or "ols"
  estimate_cate: true           # Spatial CATE via Bayesian low-rank GP
  inference: "bayesian"         # "bayesian" (V2 default: MC³ + NUTS) or "frequentist" (V1, deprecated)
  cate_estimator: "bayesian"
  discovery:
    enabled: true
    methods: [pc_stable, lingam, ges]
    alpha: 0.05
    consensus_threshold: 2
    compare_expert: true
  inference_backend: "mc3"   # "mc3" | "dibs" | "order_mcmc"
  mc3:
    n_iterations: 50000        # max cap; converges early via moving-window check
    min_iterations: 10000      # floor before convergence check activates
    converge_tol: 0.005        # stop when max edge-prob change < 0.5% over window
    converge_window: 2000      # window size (post-burnin samples)
    n_chains: 4
    temperatures: [1.0, 0.75, 0.55, 0.40]
    burnin_fraction: 0.25
    edge_penalty: 1.0
    seed: 42
    warm_start:
      enabled: true
      n_particles: 4
      n_steps: 500
      lambda_h: 1.0
  nuts:
    n_samples: 2000
    n_warmup: 1000             # ≥1000 for good mass-matrix adaptation
    per_edge_n_samples: 2000
    per_edge_n_warmup: 800
    n_chains: 2
    target_accept_rate: 0.90   # higher = smaller step size = better mixing
    max_tree_depth: 10
  bayesian_cate:
    n_features: 16              # low-RAM laptops: 16; servers: 32+
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
    kernel_lengthscale: 0.20
  wager2025:
    overlap: true               # Gap 1
    rate_qini: true             # Gap 2
    spillover: true             # Gap 3
    iv: true                    # Gaps 4-5 (only fires if DAG has instrument)
    sequential_aipw: true       # Gap 6
    panel: true                 # Gap 7 (only fires with panel cols)
    policy_learning: true       # Gap 8
    cbps: true                  # Gap 9
  actionable_variables:
    - pumping_rate_m3d
    - recharge_rate_mmyr
  fixed_variables:
    - hydraulic_conductivity_md
    - transmissivity_m2d
    - aquifer_thickness_m
    - elevation_m
    - distance_to_river_m

output:
  base_dir: "output"
  stage_dirs:
    stage_0: "Stage_0_Correlogram"
    stage_1: "Stage_1_GWEN"
    stage_2: "Stage_2_Spatial_CV"
    stage_3: "Stage_3_Causal_Validation"
    stage_4: "Stage_4_Scenarios"
    final:   "Final_Interpretation_Results"

pipeline:
  random_seed: 42
  n_spatial_folds: 5
  fast_mode: false
  overwrite_outputs: false
  run_mc_uncertainty: true     # Monte-Carlo uncertainty propagation in Stage 4
  n_mc_draws: 50               # Number of MC draws
  scenario_mode: "auto"        # auto | hybrid | dag_coefficient | model_reprediction

# temporal:
#   enabled: true
#   time_column: "measurement_date"
#   frequency: "monthly"
#   lag_features:
#     enabled: true
#     lags: [1, 3, 6, 12]
#     rolling_windows: [3, 6, 12]
#     variables: [precipitation_mm, pumping_rate_m3d]
#   temporal_cv:
#     method: "expanding_window"
#     n_splits: 5
#     gap: 1

# ---------------------------------------------------------------------------
# Stage-4 Budget Optimizer (cell-level allocation under a budget)
# ---------------------------------------------------------------------------
# Reads the per-cell cooling/benefit surface from Stage 4's
# ``scenario_results`` and allocates a budget across cells using
# greedy / 2-opt / MILP solvers.  Set ``total: null`` to skip the
# constrained optimum and emit only the Pareto frontier (cost vs benefit).
budget:
  total: null                  # null → unconstrained Pareto only
  solver: greedy_2opt          # greedy | greedy_2opt | milp
  multipliers: [0.25, 0.5, 0.75, 1.0, 1.5]
  cost_per_unit: {}            # e.g. {Pct_Canopy: 250}; empty = unit cost

# ---------------------------------------------------------------------------
# Stage-4 Wager-2025 caps (saturation + spillover folding)
# ---------------------------------------------------------------------------
# ``spillover_mode``:
#   diagnostic       — direct/spillover/total are side-columns only.
#   fold_into_delta  — headline ``delta_mean`` becomes the SUTVA-corrected
#                      total; ``delta_direct_only`` preserves the unit-level
#                      number for review.  Default in mode_5_full_audit.
# ``saturation_clipping``: when true, per-cell delta is capped at the
# Stage-3 dose-response knee (saturation_marginal_floor × peak |slope|).
caps:
  spillover_mode: fold_into_delta
  saturation_clipping: true
  saturation_marginal_floor: 0.5

# ---------------------------------------------------------------------------
# Pipeline Globals (additional V2 keys)
# ---------------------------------------------------------------------------

flags:
  use_gwen_selection: true
  include_gwrf_in_ensemble: true
  use_laplacian_eigenmaps_in_ols: false

# ---------------------------------------------------------------------------
# Model Hyperparameters
# ---------------------------------------------------------------------------
models:

  gwr:
    bandwidth: null          # null = auto-select via correlogram
    kernel: "gaussian"
    alpha: 0.1
    min_points: 50

  gwrf:
    n_estimators: 100
    k_neighbors: 100
    min_samples_leaf: 5
    n_jobs: 1
    subsample_fraction: null
    subsample_n: null

  ggpgam:
    n_splines: 5
    n_spatial_bases: 10
    lam: 0.6
    max_iter: 100

  meta_ensemble:
    algorithm: "neural"
    include_base_features: true
    include_laplacian_pca: true

  meta_learner: "neural"

  neural:
    hidden_dim: 256
    dropout: 0.1
    n_heads: 4
    max_neighbors: 128
    siren_omega: 30.0
    exceedance_thresholds: [0.25, 0.50, 0.75]
    geo_pe_dim: 32             # Geographic positional encoding dim (Space2Vec Fourier; 0 = disabled)

  spatial_cv:
    block_size: null           # null = auto from Stage 1 correlogram
    buffer_size: 300           # metres
    block_size_source: "correlogram"
    method: "block"
    stratify_y: true

# ---------------------------------------------------------------------------
# GWEN Variable Selection
# ---------------------------------------------------------------------------
gwen:
  sample_size: 5000
  k_neighbors: 500
  cv_folds: 5
  selection_threshold: 0.1
  l1_ratios: [0.1, 0.5, 0.7, 0.9, 0.95, 0.99]
  n_alphas: 100
  spatial_cv: false
  local_cv: false
  stability_folds: 0

# ---------------------------------------------------------------------------
# Laplacian Eigenmaps
# ---------------------------------------------------------------------------
laplacian:
  n_eigenmaps: 150
  k_for_swm: 10

# ---------------------------------------------------------------------------
# V2 Training Configuration
# ---------------------------------------------------------------------------
training:
  n_epochs: 100
  batch_size: 512
  learning_rate: 0.001
  lambda_mse: 1.0
  lambda_exceedance: 0.1
  lambda_physics: 0.01
  lambda_smooth_pred: 0.01
  lambda_smooth_alpha: 0.001
  lambda_alpha_prior: 1.0
  lambda_surrogate: 0.1
  lambda_neighbor: 0.1
  lambda_pde: 0.05             # V3 multi-term PDE loss (0 = disabled)

# ---------------------------------------------------------------------------
# V2 Optimization
# ---------------------------------------------------------------------------
optimization:
  run_cma_es: false
  clip_norm: 1.0
  swa_epochs: 20
  capacity_sweep: false

# ---------------------------------------------------------------------------
# JEPA — Self-supervised auxiliary objective on the SharedTrunk
# ---------------------------------------------------------------------------
# V-JEPA 2-style: EMA target trunk + masked-channel context + latent
# predictor with VICReg anti-collapse.  Set enable: true once you have
# validated the supervised pipeline for this domain.
#
# Phase 2 weights (lambda_scenario, lambda_latent_pde) are 0 by default —
# enable Phase 1 first, then raise these once it trains stably.
# ---------------------------------------------------------------------------
jepa:
  enable: false                # Set true to activate self-supervised pretraining
  pretrain_epochs: 20          # Phase 1 EMA-trunk pretraining epochs (0 = skip)
  mask_ratio: 0.4
  lambda: 1.0

  ema_tau_start: 0.99
  ema_tau_end:   0.9999
  ema_warmup_steps: 1000

  curriculum_start: 5
  curriculum_end:   15

  lambda_align:      1.0
  lambda_variance:   1.0
  lambda_covariance: 0.04
  variance_gamma:    1.0

  action_dim:        64
  predictor_blocks:  2
  predictor_film:    false     # Enable after Phase 1 is stable
  lambda_scenario:   0.0       # Phase 2: action-conditioned distillation (0 = off)
  lambda_latent_pde: 0.0       # Phase 2: latent Laplacian smoothness (0 = off)
  scenario_perturb_std: 0.5

# ---------------------------------------------------------------------------
# V2 Process Rate Network  (domain-specific — uncomment and customise)
# ---------------------------------------------------------------------------
# process_rate:
#   enabled: false
#   name: "domain_process_rate"   # e.g. "fire_spread_rate", "runoff_coefficient"
#   units: "domain units"
#   bounds: [0.0, 1.0]
#   prior_mean: 0.5
