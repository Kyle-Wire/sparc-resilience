# =============================================================================
# SPARC Project Configuration — Groundwater Domain
# =============================================================================
# Spatial regression of groundwater levels as a function of recharge,
# pumping, hydrogeology, and climate.  Temporal mode supports monitoring
# well time-series for trend analysis and forecasting.
#
# Key references:
#   - Darcy (1856) — Flow through porous media
#   - Theis (1935) — Transient well hydraulics
#   - Healy (2010) — Estimating Groundwater Recharge
# =============================================================================

project:
  name: "Groundwater Level Analysis"
  description: "Spatiotemporal analysis of groundwater levels driven by recharge, pumping, and aquifer properties"
  domain: groundwater
  version: "1.0.0"
  author: ""
  response_units: "m"

data:
  file_path: ""
  target_column: "gw_level_m"                  # Depth to groundwater (m below ground surface)
  identifier_column: "well_id"
  coord_columns: ["longitude", "latitude"]

crs:
  input: "EPSG:4326"
  projected: ""

predictors:
  - precipitation_mm          # Monthly/annual precipitation (mm)
  - recharge_rate_mmyr        # Estimated recharge rate (mm/yr)
  - pumping_rate_m3d          # Nearby well pumping rate (m³/day)
  - hydraulic_conductivity_md # Aquifer K (m/day)
  - transmissivity_m2d        # Aquifer transmissivity (m²/day)
  - distance_to_river_m       # Distance to nearest stream/river (m)
  - aquifer_thickness_m       # Saturated thickness (m)
  - elevation_m               # Land surface elevation (m)
  - NDVI                      # Vegetation index (proxy for ET demand)

physics:
  priors_file: "physics/priors.yml"
  caps_file:   "physics/caps.yml"
  monotone_constraints:
    precipitation_mm:  1            # More rain → higher water table
    recharge_rate_mmyr:  1          # More recharge → higher levels
    pumping_rate_m3d: -1            # More pumping → lower levels
    hydraulic_conductivity_md:  0   # Complex: enables flow in and out
    distance_to_river_m: -1         # Farther from river → less recharge
    NDVI: -1                        # More vegetation → more ET → lower levels

causal:
  dag_file: "causal/dag.yml"
  estimator: "dml"              # "dml" (Wager 2025 default), "hgb", or "ols"
  estimate_cate: true           # Spatial CATE via Bayesian low-rank GP
  inference: "bayesian"         # "bayesian" (V2 default: MC³ + NUTS) or "frequentist" (V1, deprecated)
  cate_estimator: "bayesian"
  discovery:
    enabled: true
    methods: [pc_stable, lingam, ges]
    alpha: 0.05
    consensus_threshold: 2
    compare_expert: true
  mc3:
    n_iterations: 10000
    n_chains: 4
    burnin_fraction: 0.25
    edge_penalty: 1.0
    seed: 42
  nuts:
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
  bayesian_cate:
    n_features: 16              # low-RAM laptops: 16; servers: 32+
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
    kernel_lengthscale: 0.20
  wager2025:
    overlap: true               # Gap 1
    rate_qini: true             # Gap 2
    spillover: true             # Gap 3
    iv: true                    # Gaps 4-5 (only fires if DAG has instrument)
    sequential_aipw: true       # Gap 6
    panel: true                 # Gap 7 (only fires with panel cols)
    policy_learning: true       # Gap 8
    cbps: true                  # Gap 9
  actionable_variables:
    - pumping_rate_m3d
    - recharge_rate_mmyr
  fixed_variables:
    - hydraulic_conductivity_md
    - transmissivity_m2d
    - aquifer_thickness_m
    - elevation_m
    - distance_to_river_m

output:
  base_dir: "output"

pipeline:
  random_seed: 42
  n_spatial_folds: 5

