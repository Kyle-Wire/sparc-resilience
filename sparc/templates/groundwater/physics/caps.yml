# Variable Caps & Constraints — Groundwater Domain

variable_bounds:
  precipitation_mm:
    min: 0.0
    max: 5000.0
    units: "mm"
    physical_justification: "Desert to tropical rainfall range"

  recharge_rate_mmyr:
    min: 0.0
    max: 1000.0
    units: "mm/yr"
    physical_justification: "Zero in arid regions to high in karst"

  pumping_rate_m3d:
    min: 0.0
    max: 50000.0
    units: "m³/day"
    physical_justification: "Inactive to large municipal well field"

  hydraulic_conductivity_md:
    min: 0.0001
    max: 1000.0
    units: "m/day"
    physical_justification: "Clay ~0.0001 to gravel ~1000 m/day"

  transmissivity_m2d:
    min: 0.01
    max: 50000.0
    units: "m²/day"
    physical_justification: "Low-K thin aquifer to high-K thick aquifer"

  distance_to_river_m:
    min: 0.0
    max: 100000.0
    units: "m"
    physical_justification: "Riparian to remote highland"

  aquifer_thickness_m:
    min: 0.5
    max: 500.0
    units: "m"
    physical_justification: "Thin perched aquifer to deep regional aquifer"

  elevation_m:
    min: -100.0
    max: 5000.0
    units: "m"
    physical_justification: "Below sea level to high mountain"

  NDVI:
    min: -0.1
    max: 0.9
    units: "index"
    physical_justification: "Water/bare soil to dense forest"

delta_constraints:
  pumping_rate_m3d:
    max_increase: 5000.0
    max_decrease: 5000.0
    typical_increase: 500.0

  recharge_rate_mmyr:
    max_increase: 200.0
    max_decrease: 0.0
    typical_increase: 50.0
