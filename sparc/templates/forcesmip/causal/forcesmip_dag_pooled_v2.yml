# =============================================================================
# ForceSMIP Causal DAG — Cross-Member Pooled Analysis (v2)
# =============================================================================
# Only includes variables present in the current pooled CSV.
# PDO_index, NAO_index omitted — require re-preprocessing from NetCDF.
# =============================================================================

nodes:
  - name: GMST_trend
    type: treatment
    description: "Global mean surface temperature trend — varies 0.73–1.72°C across members"

  - name: AMV_index
    type: treatment
    description: "Atlantic Multidecadal Variability index — varies across members"

  - name: IPO_index
    type: treatment
    description: "Interdecadal Pacific Oscillation index — varies across members"

  - name: member_id
    type: confounder
    description: "Climate model identity — captures model-specific biases"

  - name: lat_abs
    type: confounder
    description: "Absolute latitude — spatial structure"

  - name: land_fraction
    type: confounder
    description: "Land coverage fraction"

  - name: ocean_basin
    type: confounder
    description: "Ocean basin classification"

  # Outcome
  - name: tos_trend
    type: outcome
    description: "Local trend — forced component to isolate"

edges:
  # GMST → local target (pattern scaling — primary mechanism)
  - parent: GMST_trend
    child: tos_trend
    mechanism: "spatial pattern scaling of global warming"

  # AMV → local target (Atlantic influence)
  - parent: AMV_index
    child: tos_trend
    mechanism: "Atlantic multidecadal teleconnection"

  # IPO → local target (Pacific influence)
  - parent: IPO_index
    child: tos_trend
    mechanism: "Pacific decadal teleconnection"

  # GMST mediates AMV/IPO effects on global scale
  - parent: AMV_index
    child: GMST_trend
    mechanism: "AMV contribution to global mean temperature"

  - parent: IPO_index
    child: GMST_trend
    mechanism: "IPO contribution to global mean temperature"

# Temporal lagged edges (for spatiotemporal mode if activated)
temporal_edges:
  - source: GMST_trend
    target: tos_trend
    lag: 1
    description: "Global warming signal propagates to SST field with ~1-step lag"
