# =============================================================================
# ForceSMIP Causal DAG — Cross-Member Pooled Analysis (v2) — TAS
# =============================================================================
# Only includes variables present in the current pooled CSV.
# PDO_index, NAO_index omitted — require re-preprocessing from NetCDF.
# =============================================================================

nodes:
  - name: GMST_trend
    type: treatment
    description: "Global mean surface temperature trend — varies across members"

  - name: AMV_index
    type: treatment
    description: "Atlantic Multidecadal Variability index"

  - name: IPO_index
    type: treatment
    description: "Interdecadal Pacific Oscillation index"

  - name: member_id
    type: confounder
    description: "Climate model identity — captures model-specific biases"

  - name: lat_abs
    type: confounder
    description: "Absolute latitude — spatial structure"

  - name: land_fraction
    type: confounder
    description: "Land coverage fraction"

  - name: ocean_basin
    type: confounder
    description: "Ocean basin classification"

  - name: tas_trend
    type: outcome
    description: "Local near-surface air temperature trend — forced component to isolate"

edges:
  - parent: GMST_trend
    child: tas_trend
    mechanism: "spatial pattern scaling of global warming"

  - parent: AMV_index
    child: tas_trend
    mechanism: "Atlantic multidecadal teleconnection"

  - parent: IPO_index
    child: tas_trend
    mechanism: "Pacific decadal teleconnection"

  - parent: AMV_index
    child: GMST_trend
    mechanism: "AMV contribution to global mean temperature"

  - parent: IPO_index
    child: GMST_trend
    mechanism: "IPO contribution to global mean temperature"

temporal_edges:
  - source: GMST_trend
    target: tas_trend
    lag: 1
    description: "Global warming signal propagates to TAS field with ~1-step lag"
