# =============================================================================
# SPARC Project Configuration — Environmental Noise Domain
# =============================================================================
# Spatial analysis of equivalent continuous noise levels (Leq) driven by
# traffic, land use, barriers, and meteorology.
#
# Key references:
#   - FHWA Traffic Noise Model (TNM)
#   - ISO 9613-2 — Outdoor propagation
#   - WHO Environmental Noise Guidelines (2018)
# =============================================================================

project:
  name: "Environmental Noise Analysis"
  description: "Spatial regression of noise levels from traffic and industrial sources, accounting for propagation, barriers, and land use"
  domain: noise
  version: "1.0.0"
  author: ""
  response_units: "dBA"

data:
  file_path: ""
  target_column: "Leq_dBA"                    # A-weighted equivalent continuous level
  identifier_column: "receptor_id"
  coord_columns: ["longitude", "latitude"]

crs:
  input: "EPSG:4326"
  projected: ""

predictors:
  - traffic_volume_vph         # Hourly traffic volume (vehicles/hour)
  - heavy_truck_pct            # Heavy truck percentage (%)
  - distance_to_road_m         # Perpendicular distance to nearest major road (m)
  - road_speed_kmh             # Posted speed limit (km/h)
  - building_density_pct       # Building footprint coverage (%)
  - barrier_height_m           # Noise barrier height (m, 0 = none)
  - vegetation_buffer_m        # Depth of dense vegetation between source and receptor (m)
  - elevation_diff_m           # Elevation difference receptor minus road (m)
  - wind_speed_ms              # Mean wind speed (m/s)
  - temperature_C              # Ambient temperature (°C)

physics:
  priors_file: "physics/priors.yml"
  caps_file:   "physics/caps.yml"
  monotone_constraints:
    traffic_volume_vph:  1       # More traffic → more noise
    heavy_truck_pct:  1          # Trucks are louder
    distance_to_road_m: -1       # Farther → less noise (geometric spreading)
    road_speed_kmh:  1           # Faster → louder
    barrier_height_m: -1         # Taller barrier → less noise
    vegetation_buffer_m: -1      # Denser buffer → more attenuation

causal:
  dag_file: "causal/dag.yml"
  estimator: "dml"              # "dml" (Wager 2025 default), "hgb", or "ols"
  estimate_cate: true           # Spatial CATE via Bayesian low-rank GP
  inference: "bayesian"         # "bayesian" (V2 default: MC³ + NUTS) or "frequentist" (V1, deprecated)
  cate_estimator: "bayesian"
  discovery:
    enabled: true
    methods: [pc_stable, lingam, ges]
    alpha: 0.05
    consensus_threshold: 2
    compare_expert: true
  mc3:
    n_iterations: 10000
    n_chains: 4
    burnin_fraction: 0.25
    edge_penalty: 1.0
    seed: 42
  nuts:
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
  bayesian_cate:
    n_features: 16              # low-RAM laptops: 16; servers: 32+
    n_samples: 2000
    n_warmup: 500
    n_chains: 2
    target_accept_rate: 0.85
    max_tree_depth: 8
    kernel_lengthscale: 0.20
  wager2025:
    overlap: true               # Gap 1
    rate_qini: true             # Gap 2
    spillover: true             # Gap 3
    iv: true                    # Gaps 4-5 (only fires if DAG has instrument)
    sequential_aipw: true       # Gap 6
    panel: true                 # Gap 7 (only fires with panel cols)
    policy_learning: true       # Gap 8
    cbps: true                  # Gap 9
  actionable_variables:
    - barrier_height_m
    - vegetation_buffer_m
    - road_speed_kmh
  fixed_variables:
    - distance_to_road_m
    - elevation_diff_m

output:
  base_dir: "output"

pipeline:
  random_seed: 42
  n_spatial_folds: 5

