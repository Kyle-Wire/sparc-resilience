name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:       # manual trigger from GitHub UI

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ── Python (needed by beforeBuildCommand → pnpm build:sidecar) ──
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[server]"
          pip install pyinstaller

      - name: Audit Python dependencies for known CVEs
        run: |
          pip install pip-audit
          pip-audit --strict

      # ── Node + frontend ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: sparc-desktop
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies for known CVEs
        working-directory: sparc-desktop
        run: pnpm audit --audit-level=high

      # ── Rust ────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sparc-desktop/src-tauri

      # ── Build + publish GitHub Release ──────────────────────────
      # Tag push → public release. Manual dispatch → draft release.
      - name: Verify signing key present
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty or missing — updater .sig files will NOT be generated and latest.json will not be created."
            exit 1
          else
            echo "Signing key present (length: ${#TAURI_SIGNING_PRIVATE_KEY})"
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          projectPath: sparc-desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v-dev-build' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('SPARC Labs {0}', github.ref_name) || 'SPARC Labs (dev build)' }}
          releaseBody: "Download the installer for your platform below."
          releaseDraft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}
