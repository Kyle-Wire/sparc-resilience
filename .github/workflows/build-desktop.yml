name: Build Desktop App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:       # manual trigger from GitHub UI

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      # ── Python + sidecar binary ─────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[server]"
          pip install pyinstaller

      - name: Build sidecar binary
        run: python build-sidecar.py

      - name: Copy sidecar to Tauri binaries
        shell: bash
        run: |
          mkdir -p sparc-desktop/src-tauri/binaries
          # build-sidecar.py outputs "sparc-sidecar" (no target triple).
          # Tauri bundles everything in binaries/ via resources config.
          if [ "${{ runner.os }}" = "Windows" ]; then
            SRC="dist/sparc-sidecar.exe"
            DST="sparc-desktop/src-tauri/binaries/sparc-sidecar.exe"
          else
            SRC="dist/sparc-sidecar"
            DST="sparc-desktop/src-tauri/binaries/sparc-sidecar"
          fi
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            chmod +x "$DST" 2>/dev/null || true
            echo "Sidecar copied: $DST"
          else
            echo "::error::Sidecar binary not found at $SRC — build failed?"
            ls -la dist/ || true
            exit 1
          fi

      # ── Node + frontend ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: sparc-desktop
        run: pnpm install --frozen-lockfile

      # ── Rust + Tauri ────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sparc-desktop/src-tauri

      - name: Build Tauri app
        working-directory: sparc-desktop
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      # ── Upload installers ──────────────────────────────────────
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: sparc-desktop-${{ matrix.label }}
          path: |
            sparc-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            sparc-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: sparc-desktop-${{ matrix.label }}
          path: |
            sparc-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            sparc-desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 30
