name: tests

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core pipeline (sparc/core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch + core requirements)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-core.txt
          pip install --no-deps -e .
      - name: Core unit tests
        run: python -m pytest tests/core -q -o addopts="" -m "not slow and not integration" --timeout=900
      - name: Providence smoke run (brown4.csv, fast mode)
        run: python -m pytest tests/core -q -o addopts="" -m "integration" --timeout=1800

  legacy:
    name: legacy pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch + full package)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,server]" python-docx httpx pytest-timeout
      - name: Legacy tests
        run: python -m pytest tests -q -o addopts="" --ignore=tests/core --timeout=900
